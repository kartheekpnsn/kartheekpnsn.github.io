<script type="text/plain" data-module="unfold/quiz">// Check Yourself: instant-feedback quiz; best score saved locally (drives the graph's progress ring).
import { esc, md, progressFor, saveProgress } from 'unfold/util';

export function renderQuiz(el, lesson) {
  const qs = lesson.quiz || [];
  const answers = new Array(qs.length).fill(null);
  const letters = 'ABCDEFG';
  const prog = progressFor(lesson.slug);
  el.innerHTML = `<div class="doc">
    <div><h2>Check yourself</h2><p class="lede">${qs.length} questions aimed at the ideas that are easiest to get wrong. Pick an answer to see why.</p></div>
    ${qs.map((q, i) => `
      <section class="quiz-q" data-i="${i}">
        <div class="qmeta"><span class="tag">Q${i + 1}</span>${q.concept ? `<span class="tag">${esc(q.concept)}</span>` : ''}</div>
        <h3>${md(q.q, lesson.sources)}</h3>
        <div class="opts" role="group" aria-label="Options for question ${i + 1}">
          ${q.options.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${letters[j]}</span><span>${md(o, lesson.sources)}</span></button>`).join('')}
        </div>
        <div class="why" hidden></div>
      </section>`).join('')}
    <div class="score" hidden><div class="ring"></div><div><div class="big"></div><div class="lede"></div></div><button class="btn" data-retry style="margin-left:auto">Try again</button></div>
    ${prog.quizBest != null ? `<p class="lede">Your best so far: ${Math.round(prog.quizBest * 100)}%</p>` : ''}
  </div>`;

  el.querySelectorAll('.quiz-q').forEach(sec => {
    const i = +sec.dataset.i, q = qs[i];
    sec.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      if (answers[i] != null) return;
      const j = +btn.dataset.j;
      answers[i] = j;
      sec.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
      sec.querySelector(`.opt[data-j="${q.answer}"]`).classList.add('correct');
      if (j !== q.answer) btn.classList.add('wrong');
      const why = sec.querySelector('.why');
      why.hidden = false;
      why.innerHTML = `<strong>${j === q.answer ? 'Right.' : 'Not quite.'}</strong> ${md(q.why, lesson.sources)}`;
      if (answers.every(a => a != null)) finish();
    }));
  });
  el.querySelector('[data-retry]').addEventListener('click', () => renderQuiz(el, lesson));

  function finish() {
    const right = answers.filter((a, i) => a === qs[i].answer).length;
    const frac = right / qs.length;
    const box = el.querySelector('.score');
    box.hidden = false;
    box.querySelector('.ring').style.setProperty('--p', Math.round(frac * 100));
    box.querySelector('.big').textContent = `${right} / ${qs.length}`;
    const missed = [...new Set(qs.filter((q, i) => answers[i] !== q.answer).map(q => q.concept).filter(Boolean))];
    box.querySelector('.lede').textContent = missed.length ? `Revisit: ${missed.join(', ')}` : 'Every concept checks out.';
    const p = progressFor(lesson.slug);
    p.quizBest = Math.max(p.quizBest ?? 0, frac);
    saveProgress(lesson.slug, p);
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
</script>
<script type="text/plain" data-module="unfold/three-stage">// Unfold three.js stage. Same contract as the SVG kit: scenes are state-based.
// A scene with mode "three" gets k3 in mount(stage, k3) and render(state, prev, k3).
// k3.tween(obj, {x: 1, ...}) animates numeric props (on objects, vectors, materials) toward targets;
// k3.onFrame(fn) registers per-frame ambient animation; k3.cameraTo([x,y,z], [tx,ty,tz]) moves the view.

import { ease } from 'unfold/scene-kit';

let threeModPromise;
function loadThree() {
  threeModPromise ||= Promise.all([
    import('three'),
    import('three/orbit'),
  ]);
  return threeModPromise;
}

export function webglAvailable() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch { return false; }
}

export async function createThreeKit(stage, { duration = 600 } = {}) {
  const [THREE, { OrbitControls }] = await loadThree();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.position.set(6, 4, 9);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 3; controls.maxDistance = 30;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(5, 10, 7);
  scene.add(sun);

  const tweens = new Set();
  const frames = new Set();
  const updates = new Set();
  let raf = 0, paused = false, disposed = false, last = performance.now();

  const k3 = { THREE, scene, camera, renderer, controls, stage, reduced, duration: reduced ? 0 : duration };

  k3.colors = () => {
    const cs = getComputedStyle(stage);
    const g = n => cs.getPropertyValue('--' + n).trim() || '#888888';
    return { red: g('red'), green: g('green'), blue: g('blue'), yellow: g('yellow'), ink: g('ink'), muted: g('muted'),
      surface: g('surface'), line: g('line-strong'), bg: g('bg') };
  };
  k3.color = name => new THREE.Color(k3.colors()[name] || name);

  // Tween numeric props on any object. Props may be dotted paths ("position.y") or THREE.Color targets.
  k3.tween = (obj, to, { dur = k3.duration, delay = 0 } = {}) => {
    for (const tw of tweens) if (tw.obj === obj) for (const k of Object.keys(to)) delete tw.to[k];
    const from = {};
    const get = path => path.split('.').reduce((o, k) => o?.[k], obj);
    for (const k of Object.keys(to)) {
      const v = get(k);
      from[k] = v?.isColor ? v.clone() : v;
    }
    const tw = { obj, from, to: { ...to }, start: performance.now() + delay, dur };
    tweens.add(tw);
    if (!dur) step(performance.now());
    return tw;
  };
  function applyTween(tw, t) {
    for (const k of Object.keys(tw.to)) {
      const parts = k.split('.'), leaf = parts.pop();
      const target = parts.reduce((o, p) => o?.[p], tw.obj);
      if (!target) continue;
      const a = tw.from[k], b = tw.to[k];
      if (a?.isColor) { target[leaf].copy(a).lerp(b?.isColor ? b : new THREE.Color(b), t); }
      else if (typeof a === 'number') target[leaf] = a + (b - a) * t;
      else if (t >= 1) target[leaf] = b;
    }
  }
  k3.cameraTo = (pos, target = [0, 0, 0], opts) => {
    k3.tween(camera, { 'position.x': pos[0], 'position.y': pos[1], 'position.z': pos[2] }, opts);
    k3.tween(controls, { 'target.x': target[0], 'target.y': target[1], 'target.z': target[2] }, opts);
  };
  k3.onFrame = fn => { frames.add(fn); return () => frames.delete(fn); };       // ambient: skipped when paused / reduced motion
  k3.onUpdate = fn => { updates.add(fn); return () => updates.delete(fn); };     // always runs, after tweens
  k3.setPaused = p => { paused = p; };

  function resize() {
    const w = stage.clientWidth || 800, h = stage.clientHeight || 450;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(resize);
  ro.observe(stage);
  resize();

  function step(now) {
    for (const tw of [...tweens]) {
      const t = tw.dur ? Math.max(0, Math.min(1, (now - tw.start) / tw.dur)) : 1;
      if (now < tw.start) continue;
      applyTween(tw, ease(t));
      if (t >= 1) tweens.delete(tw);
    }
  }
  function loop(now) {
    if (disposed) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(now);
    if (!paused && !reduced) for (const fn of frames) fn(dt, now);
    for (const fn of updates) fn(dt, now);
    controls.update();
    renderer.render(scene, camera);
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  // ---------- helpers ----------
  // Text in 3D: a camera-facing sprite drawn on a canvas. Returns the sprite; sprite.setText('new') redraws it.
  k3.label3d = (text, { size = 0.45, color = 'ink', weight = 700, bg = null } = {}) => {
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
    sprite.setText = (t, col = color) => {
      const font = `${weight} 64px ${getComputedStyle(stage).fontFamily || 'sans-serif'}`;
      ctx.font = font;
      const w = Math.ceil(ctx.measureText(t).width) + 32, h = 96;
      cv.width = w; cv.height = h;
      ctx.font = font; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      if (bg) { ctx.fillStyle = k3.colors()[bg] || bg; ctx.beginPath(); ctx.roundRect(0, 8, w, h - 16, 40); ctx.fill(); }
      ctx.fillStyle = k3.colors()[col] || col; ctx.fillText(t, w / 2, h / 2 + 2);
      tex.needsUpdate = true;
      sprite.scale.set(size * w / h, size, 1);
    };
    sprite.setText(String(text));
    return sprite;
  };
  // A cloud of points. update(fn(i, p)) lets you move each point (p = [x, y, z]).
  k3.particles = ({ count = 300, area = [6, 3, 3], size = 0.06, color = 'blue', opacity = 0.9 } = {}) => {
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) for (let a = 0; a < 3; a++) pos[i * 3 + a] = (Math.random() - 0.5) * area[a];
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const points = new THREE.Points(geo, new THREE.PointsMaterial({ size, color: k3.color(color), transparent: true, opacity, depthWrite: false }));
    points.update = fn => { const p = [0, 0, 0]; for (let i = 0; i < count; i++) { p[0] = pos[i * 3]; p[1] = pos[i * 3 + 1]; p[2] = pos[i * 3 + 2]; fn(i, p); pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1]; pos[i * 3 + 2] = p[2]; } geo.attributes.position.needsUpdate = true; };
    return points;
  };
  // Particles carried by a velocity field v(x, y, z) -> [vx, vy, vz]; they respawn at the min-x edge.
  k3.flowField = (velocity, { count = 400, min = [-4, -2, -1.5], max = [4, 2, 1.5], size = 0.05, color = 'blue', speed = 1 } = {}) => {
    const span = max.map((v, i) => v - min[i]);
    const pts = k3.particles({ count, size, color, area: span });
    pts.position.set(0, 0, 0);
    pts.update((i, p) => { for (let a = 0; a < 3; a++) p[a] = min[a] + Math.random() * span[a]; });
    let field = velocity;
    pts.setVelocity = fn => { field = fn; };
    k3.onFrame(dt => pts.update((i, p) => {
      const v = field(p[0], p[1], p[2]);
      for (let a = 0; a < 3; a++) p[a] += v[a] * dt * speed;
      if (p.some((c, a) => c < min[a] - 0.01 || c > max[a] + 0.01)) { p[0] = min[0]; p[1] = min[1] + Math.random() * span[1]; p[2] = min[2] + Math.random() * span[2]; }
    }));
    return pts;
  };
  // An instanced grid of cubes (tensors, neurons, pixels). grid.set(i, { value 0..1 (height), color }).
  k3.grid = ({ nx = 8, ny = 4, nz = 1, cell = 0.4, gap = 0.06, color = 'blue' } = {}) => {
    const n = nx * ny * nz, mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(cell, cell, cell), new THREE.MeshStandardMaterial({ roughness: 0.6 }), n);
    const m = new THREE.Matrix4(), step = cell + gap, vals = new Float32Array(n).fill(1), c = k3.color(color);
    const place = i => {
      const ix = i % nx, iy = Math.floor(i / nx) % ny, iz = Math.floor(i / (nx * ny)), h = Math.max(0.05, vals[i]);
      m.makeScale(1, h, 1).setPosition((ix - (nx - 1) / 2) * step, (iz * step) + cell * h / 2, (iy - (ny - 1) / 2) * step);
      mesh.setMatrixAt(i, m);
    };
    for (let i = 0; i < n; i++) { place(i); mesh.setColorAt(i, c); }
    mesh.set = (i, { value, color: col } = {}) => {
      if (value != null) { vals[i] = value; place(i); mesh.instanceMatrix.needsUpdate = true; }
      if (col) { mesh.setColorAt(i, k3.color(col)); mesh.instanceColor.needsUpdate = true; }
    };
    mesh.count = n;
    return mesh;
  };
  // Extrude an SVG path (M L H V C Q Z, absolute or relative) into a solid. scale: SVG px -> world units.
  k3.extrude = (d, { depth = 0.3, scale = 0.02, color = 'blue', bevel = 0.02 } = {}) => {
    const shape = pathToShape(THREE, d, scale);
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 2 });
    geo.center();
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: k3.color(color), roughness: 0.5 }));
  };
  // A step's state.camera = { pos: [x, y, z], target: [x, y, z] } glides the view (the player calls this).
  k3.applyCamera = cam => { if (cam?.pos) k3.cameraTo(cam.pos, cam.target || [0, 0, 0]); };
  k3.hasLoops = () => frames.size > 0;

  k3.isAnimating = () => tweens.size > 0;
  k3.refreshColors = () => { k3.onThemeChange?.(); };
  k3.destroy = () => {
    disposed = true;
    cancelAnimationFrame(raf);
    ro.disconnect();
    controls.dispose();
    scene.traverse(o => { o.geometry?.dispose?.(); [].concat(o.material || []).forEach(m => m.dispose?.()); });
    renderer.dispose();
    renderer.domElement.remove();
  };
  return k3;
}

// ---------- SVG path -> THREE.Shape ----------
function pathToShape(THREE, d, k) {
  const shape = new THREE.Shape();
  const toks = d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g) || [];
  let i = 0, cmd = 'M', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => +toks[i++];
  const P = (px, py) => [px * k, -py * k];
  while (i < toks.length) {
    if (/[a-zA-Z]/.test(toks[i])) cmd = toks[i++];
    const rel = cmd === cmd.toLowerCase(), C = cmd.toUpperCase();
    const ax = v => (rel ? x + v : v), ay = v => (rel ? y + v : v);
    if (C === 'M') { x = ax(num()); y = ay(num()); sx = x; sy = y; shape.moveTo(...P(x, y)); cmd = rel ? 'l' : 'L'; }
    else if (C === 'L') { x = ax(num()); y = ay(num()); shape.lineTo(...P(x, y)); }
    else if (C === 'H') { x = ax(num()); shape.lineTo(...P(x, y)); }
    else if (C === 'V') { y = ay(num()); shape.lineTo(...P(x, y)); }
    else if (C === 'C') { const a = [ax(num()), ay(num()), ax(num()), ay(num()), ax(num()), ay(num())]; shape.bezierCurveTo(...P(a[0], a[1]), ...P(a[2], a[3]), ...P(a[4], a[5])); x = a[4]; y = a[5]; }
    else if (C === 'Q') { const a = [ax(num()), ay(num()), ax(num()), ay(num())]; shape.quadraticCurveTo(...P(a[0], a[1]), ...P(a[2], a[3])); x = a[2]; y = a[3]; }
    else if (C === 'Z') { shape.closePath(); x = sx; y = sy; if (i < toks.length && !/[a-zA-Z]/.test(toks[i])) cmd = 'L'; }
    else i++;   // unsupported command (A, S, T): skip a token
  }
  return shape;
}

// ---------- the "3d" style: lit meshes for the SVG kit's box / plate / token ----------
// An orthographic camera at the kit's exact isometric angle and scale, so meshes line up with the SVG labels,
// arrows and text drawn on top. Scenes don't change: the kit calls update(key, type, props) for every frame.
export async function createIsoMesh(stage, kit) {
  const [THREE] = await loadThree();
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 200);
  const dir = new THREE.Vector3(1, 1, 1).normalize();
  cam.position.copy(dir.clone().multiplyScalar(50)); cam.up.set(0, 1, 0); cam.lookAt(0, 0, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a96a6, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7);
  sun.position.set(3, 10, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 0.5, far: 40 });
  sun.shadow.bias = -0.0005; sun.shadow.radius = 4;
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.13 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002; ground.receiveShadow = true;
  scene.add(ground);

  const box = new THREE.BoxGeometry(1, 1, 1), edges = new THREE.EdgesGeometry(box), disc = new THREE.CylinderGeometry(1, 1, 1, 40);
  const discEdges = new THREE.EdgesGeometry(disc, 30);
  const objs = new Map();
  const col = v => { const h = kit.color(v); try { return new THREE.Color(h); } catch { return new THREE.Color('#888888'); } };
  const S = () => kit.scale * Math.sqrt(1.5);

  function make(type) {
    const geo = type === 'token' ? disc : box;
    // boxes get one material for the sides and one for the top face (BoxGeometry groups: +x -x +y -y +z -z)
    const side = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0, transparent: true });
    const top = type === 'box' ? new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0, transparent: true }) : side;
    const mesh = new THREE.Mesh(geo, type === 'box' ? [side, side, top, side, side, side] : side);
    mesh.castShadow = type !== 'plate'; mesh.receiveShadow = true;
    const solid = new THREE.LineBasicMaterial({ transparent: true }), dashed = new THREE.LineDashedMaterial({ transparent: true, dashSize: 0.12, gapSize: 0.09 });
    const line = new THREE.LineSegments(type === 'token' ? discEdges : edges, solid);
    mesh.add(line);
    scene.add(mesh);
    return { mesh, line, type, side, top, solid, dashed };
  }
  const setDashed = (o, on) => {
    const m = on ? o.dashed : o.solid;
    if (o.line.material !== m) { o.line.material = m; if (on) o.line.computeLineDistances(); }
    if (on) { o.dashed.scale = Math.max(0.2, (o.mesh.scale.x + o.mesh.scale.z) / 2); }
  };
  function updateCamera() {
    const vb = kit.viewBox(), r = stage.getBoundingClientRect();
    const sa = (r.width || 800) / (r.height || 500), va = vb.w / vb.h;
    let vx0 = vb.x, vx1 = vb.x + vb.w, vy0 = vb.y, vy1 = vb.y + vb.h;
    if (sa > va) { const w = vb.h * sa, cx = vb.x + vb.w / 2; vx0 = cx - w / 2; vx1 = cx + w / 2; }
    else { const h = vb.w / sa, cy = vb.y + vb.h / 2; vy0 = cy - h / 2; vy1 = cy + h / 2; }
    const [ox, oy] = kit.origin, s = S();
    cam.left = (vx0 - ox) / s; cam.right = (vx1 - ox) / s; cam.top = (oy - vy0) / s; cam.bottom = (oy - vy1) / s;
    cam.updateProjectionMatrix();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    const c = renderer.domElement;
    if (c.width !== Math.round(w * renderer.getPixelRatio()) || c.height !== Math.round(h * renderer.getPixelRatio())) renderer.setSize(w, h, false);
  }
  const api = {
    update(key, type, p) {
      let o = objs.get(key);
      if (!o) { o = make(type); objs.set(key, o); }
      o.props = p;
      const { mesh, line, side, top } = o, op = p.opacity ?? 1;
      if (type === 'box') {
        const { x = 0, y = 0, z = 0, w = 1, d = 1, h = 1 } = p;
        mesh.scale.set(w, Math.max(0.001, h), d); mesh.position.set(x + w / 2, z + h / 2, y + d / 2);
        side.color = col(p.color || 'blue');
        top.color = p.topColor ? col(p.topColor) : side.color;
        side.opacity = top.opacity = op * (p.dashed ? 0.12 : 1);
        line.material.color = p.dashed ? col('muted') : col(p.outline || p.color || 'blue').multiplyScalar(0.62);
        line.material.opacity = op * (p.dashed ? 0.8 : 0.55);
      } else if (type === 'plate') {
        const { x = 0, y = 0, z = 0, w = 1, d = 1 } = p, t = 0.04;
        mesh.scale.set(w, t, d); mesh.position.set(x + w / 2, z - t / 2, y + d / 2);
        side.color = col(p.color || 'surface-2');
        side.opacity = p.fill === 'none' ? 0 : op * (p.fillOpacity ?? 1) * (p.dashed ? 0.35 : 1);
        line.material.color = col(p.stroke || 'line-strong'); line.material.opacity = op * 0.9;
      } else {
        const r = (p.r || 14) / S(), t = 0.16;
        mesh.scale.set(r, t, r); mesh.position.set(p.x || 0, (p.z || 0) + t / 2 + 0.08, p.y || 0);
        side.color = col(p.color || 'blue'); side.opacity = op;
        line.material.color = col(p.color || 'blue').multiplyScalar(0.6); line.material.opacity = op * 0.6;
      }
      side.depthWrite = top.depthWrite = side.opacity > 0.98;
      setDashed(o, !!p.dashed);
      mesh.visible = op > 0.01;
    },
    remove(key) { const o = objs.get(key); if (!o) return; scene.remove(o.mesh); for (const m of new Set([o.side, o.top, o.solid, o.dashed])) m.dispose(); objs.delete(key); },
    refresh() { for (const [key, o] of objs) if (o.props) api.update(key, o.type, o.props); },
    render() { updateCamera(); renderer.render(scene, cam); },
    animating: () => false,
    destroy() { ro.disconnect(); for (const k of [...objs.keys()]) api.remove(k); box.dispose(); edges.dispose(); disc.dispose(); discEdges.dispose(); renderer.dispose(); renderer.domElement.remove(); },
  };
  const ro = new ResizeObserver(() => api.render());
  ro.observe(stage);
  return api;
}
</script>
<script type="text/plain" data-module="unfold/player">// Unfold player: the shared engine every topic page boots.
// build-page.mjs inlines this engine, the topic's lesson.json + scenes.js, and the folder navigation
// into one self-contained index.html, so pages open from disk with no server.
// Route: #/<topic>/<tab>/<step>   (deep-dive sub-lessons: #/<topic>/deep-dive:<sub>/<step>)

import { createKit } from 'unfold/scene-kit';
import { createThreeKit, createIsoMesh, webglAvailable } from 'unfold/three-stage';
import { STYLES } from 'unfold/templates';
import { icon } from 'unfold/icons';
import { esc, md, highlightLines, initTheme, copyText, progressFor, saveProgress, store, PLAYER_VERSION } from 'unfold/util';
import { renderQuiz } from 'unfold/quiz';

const STEPPER_KINDS = new Set(['stepper', 'lessons']);
const DEFAULT_ICONS = { eli5: 'lightbulb', core: 'flash', technical: 'code', 'deep-dive': 'layer', playground: 'options',
  story: 'history', tradeoffs: 'scales', check: 'question-circle', cheatsheet: 'document-text', related: 'branch' };
// Autoplay waits long enough to read the narration (~230 words a minute) plus the animation.
const autoplayMs = step => Math.max(3500, Math.min(16000, 1800 + String(step?.narration || '').split(/\s+/).length * 260));

// nav = { crumbs: [{title, href}], children: [{title, href}], topics: [{title, href, key}] } (hrefs relative to this page)
export function boot({ lesson, scenes, nav }) {
  const player = new Player(lesson, scenes || {}, nav || { crumbs: [], children: [], topics: [] });
  window.__unfold = { player };   // read-only handle for scripts/render-check.mjs
  player.start();
}

const keyOf = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

class Player {
  constructor(lesson, scenes, nav) {
    this.lesson = lesson; this.scenes = scenes; this.nav = nav;
    this.tabs = lesson.tabs;
    this.stage = null;     // { sceneId, scene, inst, el, mode }
    this.prevState = null;
    this.mountToken = 0;
    this.autoplay = null;
    this.route = null;
    this.progress = progressFor(lesson.slug);
    // Styles the learner can switch between: lesson.style first, then lesson.altStyles.
    this.styleOptions = [...new Set([lesson.style || 'isometric', ...(lesson.altStyles || [])])].filter(x => STYLES[x]);
    this.userStyle = store.get('style:' + lesson.slug, null);
    if (!this.styleOptions.includes(this.userStyle)) this.userStyle = null;
  }

  styleFor(tab) {
    const st = this.userStyle || tab?.style || this.lesson.style || 'isometric';
    return STYLES[st] ? st : 'isometric';
  }

  start() {
    document.title = `${this.lesson.title} · Unfold`;
    document.body.innerHTML = this.skeleton();
    this.$ = sel => document.querySelector(sel);
    initTheme(this.$('#theme-btn'), () => { this.stage?.inst?.refreshColors?.(); this.$('#theme-btn').innerHTML = icon(this.isDark() ? 'weather-sunny' : 'weather-moon', 18); });
    this.renderNav(this.$('.pane-tree'));
    this.$('.menu-btn').addEventListener('click', () => document.body.classList.toggle('tree-open'));
    this.bindTabs();
    this.bindKeys();
    this.bindSearch();
    addEventListener('hashchange', () => this.onRoute());
    this.onRoute();
  }

  isDark() { return document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); }

  skeleton() {
    const tabs = this.tabs.map((t, i) => `<button class="tab" role="tab" data-tab="${esc(t.id)}" title="${esc(t.title)} (${i + 1})">
      ${icon(t.icon || DEFAULT_ICONS[t.id] || 'circle-hint', 16)}<span class="label">${esc(t.title)}</span></button>`).join('');
    return `
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="Topics">${icon('navigation', 18)}</button>
        <a class="brand" href="${esc(this.nav.home || '#')}" title="All topics"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>Unfold</span></a>
        <nav class="tabs${this.tabs.length > 6 ? ' many' : ''}" role="tablist" aria-label="Lesson tabs">${tabs}</nav>
        <div class="top-actions">
          <div class="search">${icon('search', 16)}<input type="search" placeholder="Search steps & topics" aria-label="Search"><div class="search-results"></div></div>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode">${icon('weather-moon', 18)}</button>
        </div>
      </header>
      <div class="shell">
        <aside class="pane-tree"></aside>
        <main class="center" id="center"></main>
        <aside class="pane-narr" id="narr" aria-live="polite"></aside>
      </div>`;
  }

  // ---------- folder navigation (left pane) ----------
  renderNav(el) {
    const N = this.nav, L = this.lesson;
    const link = (t, cls = '') => `<li><a href="${esc(t.href)}" class="${cls}">${icon(cls === 'current' ? 'book-open' : 'circle-hint', 14)}${esc(t.title)}</a></li>`;
    let html = `<div class="tree-title">Topics</div><nav class="tree" aria-label="Topics">`;
    if (N.home) html += `<ul><li><a href="${esc(N.home)}">${icon('organization', 14)}All topics (graph)</a></li></ul>`;
    if (N.crumbs.length) html += `<div class="tree-domain">Part of</div><ul>${N.crumbs.map(c => link(c)).join('')}</ul>`;
    html += `<div class="tree-domain">This topic</div><ul><li><a href="#" class="current" aria-current="page">${icon('book-open', 14)}${esc(L.title)}</a>`;
    if (N.children.length) html += `<ul>${N.children.map(c => link(c)).join('')}</ul>`;
    html += `</li></ul>`;
    const others = N.topics.filter(t => !t.self && !N.crumbs.some(c => c.href === t.href) && !N.children.some(c => c.href === t.href));
    if (others.length) html += `<div class="tree-domain">Other topics</div><ul>${others.map(t => `<li><a href="${esc(t.href)}" style="padding-left:${8 + 12 * (t.depth || 0)}px">${icon('circle-hint', 14)}${esc(t.title)}</a></li>`).join('')}</ul>`;
    el.innerHTML = html + `</nav><div class="tree-foot">${N.topics.length} topic${N.topics.length === 1 ? '' : 's'} in your library</div>`;
  }
  findTopic(r) { const k = keyOf(r.id), t = keyOf(r.title); return this.nav.topics.find(x => x.key === k || keyOf(x.title) === t || x.key === t); }

  // ---------- routing ----------
  parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    let [, tabSeg, stepSeg] = parts;
    let [tabId, sub] = (tabSeg || '').split(':');
    let tab = this.tabs.find(t => t.id === tabId) || this.tabs[0];
    if (tab.kind === 'lessons') { if (!tab.lessons.some(l => l.id === sub)) sub = tab.lessons[0].id; } else sub = null;
    const steps = this.stepsOf(tab, sub);
    let step = Math.max(1, parseInt(stepSeg, 10) || 1);
    if (steps) step = Math.min(step, steps.length);
    return { tab, sub, step };
  }
  hashFor(tabId, sub, step) { return `#/${this.lesson.slug}/${tabId}${sub ? ':' + sub : ''}${step ? '/' + step : ''}`; }
  go(tabId, sub, step, replace = false) {
    const h = this.hashFor(tabId, sub, step);
    if (location.hash === h) return;
    if (replace) history.replaceState(null, '', h); else location.hash = h;
    if (replace) this.onRoute();
  }
  stepsOf(tab, sub) {
    if (tab.kind === 'stepper') return tab.steps;
    if (tab.kind === 'lessons') return (tab.lessons.find(l => l.id === sub) || tab.lessons[0]).steps;
    return null;
  }

  onRoute() {
    const r = this.parseHash();
    const canonical = this.hashFor(r.tab.id, r.sub, this.stepsOf(r.tab, r.sub) ? r.step : null);
    if (location.hash !== canonical) history.replaceState(null, '', canonical);
    const tabChanged = !this.route || this.route.tab !== r.tab || this.route.sub !== r.sub;
    this.route = r;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === r.tab.id)));
    document.querySelector(`.tab[data-tab="${CSS.escape(r.tab.id)}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    document.body.classList.remove('tree-open');
    if (tabChanged) this.renderTab(r);
    else if (STEPPER_KINDS.has(r.tab.kind)) this.showStep(r.step - 1);
  }

  // ---------- tabs ----------
  bindTabs() {
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => this.go(b.dataset.tab, null, null)));
  }

  teardownStage() {
    this.stopAutoplay();
    this.mountToken++;
    if (this.stage?.inst) { try { this.stage.inst.destroy(); } catch (e) { console.error(e); } }
    this.stage = null;
    this.prevState = null;
  }

  renderTab(r) {
    this.teardownStage();
    const shell = document.querySelector('.shell');
    const center = this.$('#center'), narr = this.$('#narr');
    const { tab } = r;
    const wide = !STEPPER_KINDS.has(tab.kind) && tab.kind !== 'playground';
    shell.classList.toggle('wide', wide);
    narr.hidden = wide;
    center.innerHTML = '';
    narr.innerHTML = '';
    window.scrollTo(0, 0);

    if (STEPPER_KINDS.has(tab.kind)) {
      center.innerHTML = this.headHtml(tab) + (tab.kind === 'lessons' ? this.subtabsHtml(tab, r.sub) : '') + this.stageCardHtml(true);
      narr.innerHTML = this.narrSkeleton();
      this.bindStageControls();
      this.renderRail();
      this.showStep(r.step - 1, { first: true });
    } else if (tab.kind === 'playground') {
      center.innerHTML = this.headHtml(tab) + this.stageCardHtml(false);
      this.bindStyleControls();
      this.renderPlayground(tab, narr);
    } else if (tab.kind === 'quiz') {
      renderQuiz(center, this.lesson);
    } else if (tab.kind === 'related') {
      center.innerHTML = this.relatedHtml();
      center.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyText(b.dataset.copy)));
    } else if (tab.kind === 'cheatsheet') {
      center.innerHTML = this.cheatsheetHtml(tab);
      center.querySelector('[data-print]')?.addEventListener('click', () => print());
    } else if (tab.kind === 'story') {
      center.innerHTML = this.storyHtml(tab);
    } else if (tab.kind === 'tradeoffs') {
      center.innerHTML = this.tradeoffsHtml(tab);
    } else {
      center.innerHTML = `<div class="doc"><p class="lede">Unknown tab kind “${esc(tab.kind)}”.</p></div>`;
      console.error(`Unknown tab kind: ${tab.kind}`);
    }
  }

  headHtml(tab) {
    const L = this.lesson;
    const totalSteps = this.tabs.reduce((n, t) => n + (t.kind === 'stepper' ? t.steps.length : t.kind === 'lessons' ? t.lessons.reduce((m, l) => m + l.steps.length, 0) : 0), 0);
    return `<div class="lesson-head">
      <h1>${esc(L.title)}</h1>
      <div class="meta">
        <span class="chip level">${esc(cap(L.level))}</span>
        <span class="chip">${icon('history', 14)} ${L.duration === '2h' ? '2 hours' : '30 min'}</span>
        <span class="chip">${totalSteps} steps</span>
        <span class="chip">${icon(tab.icon || DEFAULT_ICONS[tab.id] || 'circle-hint', 14)} ${esc(tab.title)}</span>
      </div></div>`;
  }
  subtabsHtml(tab, sub) {
    return `<div class="subtabs">${tab.lessons.map(l => `<a href="${this.hashFor(tab.id, l.id, 1)}" class="${l.id === sub ? 'on' : ''}">${esc(l.title)}</a>`).join('')}</div>`;
  }
  stageCardHtml(withRail) {
    return `<section class="stage-card">
      <div class="stage-top">
        <div class="metrics" id="metrics"></div>
        <div class="ctrls">
          ${this.styleOptions.length > 1 ? `<div class="style-seg" role="group" aria-label="Drawing style">${this.styleOptions.map(o =>
            `<button data-style="${esc(o)}" aria-pressed="${this.styleFor(this.route?.tab) === o}">${esc(STYLES[o].label)}</button>`).join('')}</div>` : ''}
          <button class="btn" id="motion-btn" hidden title="Pause background motion">${icon('pause', 16)}<span>Motion</span></button>
          ${withRail ? `<button class="btn" id="replay-btn" title="Replay this step (R)">${icon('arrow-counterclockwise', 16)}<span>Replay</span></button>
          <button class="btn" id="play-btn" title="Autoplay steps (Space)">${icon('play', 16)}<span>Play</span></button>` : ''}
        </div>
      </div>
      <div class="stage" id="stage"></div>
      ${withRail ? '<div class="rail" id="rail" role="tablist" aria-label="Steps"></div>' : ''}
    </section>`;
  }
  narrSkeleton() {
    return `<div><div class="step-count" id="step-count"></div><h2 class="step-title" id="step-title"></h2></div>
      <div class="narration" id="narration"></div>
      <div id="callout"></div>
      <div id="changed"></div>
      <div><div class="nav-btns">
        <button class="btn" id="back-btn">${icon('arrow-left', 16)} Back</button>
        <button class="btn primary" id="next-btn">Next ${icon('arrow-right', 16)}</button>
      </div></div>
      <div class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> steps · <kbd>Space</kbd> play · <kbd>R</kbd> replay · <kbd>1</kbd>–<kbd>9</kbd> tabs</div>
      <div id="code"></div>
      ${this.objectivesHtml()}`;
  }
  objectivesHtml() {
    const done = this.progress.objectives || {};
    return `<div><div class="section-label">You'll learn</div><ul class="objectives">${(this.lesson.objectives || []).map((o, i) =>
      `<li><label><input type="checkbox" data-obj="${i}" ${done[i] ? 'checked' : ''}><span>${md(o, this.lesson.sources)}</span></label></li>`).join('')}</ul></div>`;
  }

  bindStyleControls() {
    document.querySelectorAll('.style-seg button').forEach(b => b.addEventListener('click', () => {
      this.userStyle = b.dataset.style;
      store.set('style:' + this.lesson.slug, this.userStyle);
      document.querySelectorAll('.style-seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const { tab, sub, step } = this.route;
      this.teardownStageOnly();
      if (tab.kind === 'playground') this.renderTab(this.route);
      else { const cur = this.stepsOf(tab, sub)[step - 1]; this.renderScene(cur.scene, cur.state, { animateIn: true }); }
    }));
    this.$('#motion-btn')?.addEventListener('click', () => {
      const inst = this.stage?.inst; if (!inst) return;
      this.motionPaused = !this.motionPaused;
      inst.setPaused?.(this.motionPaused);
      this.syncMotionBtn();
    });
  }
  syncMotionBtn() {
    const b = this.$('#motion-btn'); if (!b) return;
    const has = !!this.stage?.inst?.hasLoops?.() && !this.stage.inst.reduced;
    b.hidden = !has;
    if (has) { this.stage.inst.setPaused?.(!!this.motionPaused); b.innerHTML = `${icon(this.motionPaused ? 'play' : 'pause', 16)}<span>Motion</span>`; b.setAttribute('aria-pressed', String(!!this.motionPaused)); }
  }

  bindStageControls() {
    this.bindStyleControls();
    this.$('#replay-btn')?.addEventListener('click', () => this.replay());
    this.$('#play-btn')?.addEventListener('click', () => this.toggleAutoplay());
    this.$('#back-btn')?.addEventListener('click', () => this.stepBy(-1));
    this.$('#next-btn')?.addEventListener('click', () => this.stepBy(1));
    document.querySelectorAll('[data-obj]').forEach(cb => cb.addEventListener('change', () => {
      this.progress.objectives = { ...(this.progress.objectives || {}), [cb.dataset.obj]: cb.checked };
      saveProgress(this.lesson.slug, this.progress);
    }));
    // swipe between steps on touch devices
    const st = this.$('#stage');
    let x0 = null;
    st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    st.addEventListener('touchend', e => {
      if (x0 == null || this.stage?.mode === 'three') return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) this.stepBy(dx < 0 ? 1 : -1);
    });
  }

  renderRail() {
    const steps = this.stepsOf(this.route.tab, this.route.sub);
    this.$('#rail').innerHTML = steps.map((s, i) => `<div class="rail-step" data-i="${i}">
      <button class="rail-dot" role="tab" title="${esc(s.title)}" aria-label="Step ${i + 1}: ${esc(s.title)}">${i + 1}</button></div>`).join('');
    this.$('#rail').querySelectorAll('.rail-step').forEach(el => el.querySelector('button').addEventListener('click', () => {
      this.stopAutoplay();
      this.go(this.route.tab.id, this.route.sub, +el.dataset.i + 1);
    }));
  }

  stepBy(d) {
    if (!this.route || !STEPPER_KINDS.has(this.route.tab.kind)) return;
    const steps = this.stepsOf(this.route.tab, this.route.sub);
    const n = this.route.step + d;
    if (n > steps.length && d > 0) {
      const nextTab = this.tabs[this.tabs.indexOf(this.route.tab) + 1];
      if (nextTab && !this.autoplay) this.go(nextTab.id, null, null);
      return;
    }
    if (n < 1 || n > steps.length) return;
    this.go(this.route.tab.id, this.route.sub, n);
  }

  // ---------- stepper ----------
  async showStep(i, { first = false } = {}) {
    const { tab, sub } = this.route;
    const steps = this.stepsOf(tab, sub);
    const step = steps[i];
    const prevStep = this.lastStepShown;
    this.lastStepShown = step;
    const L = this.lesson;

    // narration pane
    this.$('#step-count').textContent = `Step ${i + 1} / ${steps.length}`;
    this.$('#step-title').textContent = step.title;
    this.$('#narration').innerHTML = md(step.narration, L.sources, { block: true });
    const c = step.callout;
    const cIcon = { 'good-to-know': 'lightbulb', warning: 'warning', insight: 'sparkle' };
    const cLabel = { 'good-to-know': 'Good to know', warning: 'Watch out', insight: 'Insight' };
    this.$('#callout').innerHTML = c ? `<div class="callout ${esc(c.kind)}">${icon(cIcon[c.kind] || 'info', 16)}<div><b>${cLabel[c.kind] || 'Note'}</b>${md(c.text, L.sources)}</div></div>` : '';
    const changed = (step.whatChanged || []).map(w => {
      const t = typeof w === 'string' ? w : w.text;
      const kind = typeof w === 'string' ? (t[0] === '-' ? 'rm' : t[0] === '~' ? 'hl' : 'add') : (w.kind || 'add');
      return `<li class="${kind}">${md(t.replace(/^[-+~]\s*/, ''), L.sources)}</li>`;
    }).join('');
    this.$('#changed').innerHTML = changed ? `<div class="section-label">What changed</div><ul class="changed-list">${changed}</ul>` : '';
    const code = step.code || (tab.code && { ...tab.code, highlight: step.highlight || [] });
    let codeHtml = '';
    if (step.formula) codeHtml += `<div class="section-label">Formula</div><div class="formula">${esc(step.formula)}</div>`;
    if (code?.src) {
      const hl = new Set(code.highlight || []);
      codeHtml += `<div class="section-label" style="margin-top:${step.formula ? 12 : 0}px">${esc(code.title || (code.lang === 'pseudo' ? 'Pseudocode' : 'Code'))}</div>
        <div class="code" aria-label="code">${highlightLines(code.src).map((l, n) => `<span class="ln${hl.has(n + 1) ? ' hl' : ''}" data-n="${n + 1}">${l || ' '}</span>`).join('')}</div>`;
    }
    this.$('#code').innerHTML = codeHtml;
    this.$('#back-btn').disabled = i === 0;
    const nextBtn = this.$('#next-btn');
    const last = i === steps.length - 1;
    const nextTab = last ? this.tabs[this.tabs.indexOf(tab) + 1] : null;
    nextBtn.disabled = last && !nextTab;
    nextBtn.innerHTML = last && nextTab ? `${esc(nextTab.title)} ${icon('arrow-right', 16)}` : `Next ${icon('arrow-right', 16)}`;

    // metrics (highlight those that changed since the previous step)
    const pm = prevStep?.metrics || {};
    this.$('#metrics').innerHTML = Object.entries(step.metrics || {}).map(([k, v]) =>
      `<span class="metric${!first && pm[k] !== undefined && String(pm[k]) !== String(v) ? ' changed' : ''}">${esc(k)} <b data-metric="${esc(k)}">${esc(v)}</b></span>`).join('');
    if (!first) this.countMetrics(pm, step.metrics || {});

    // rail + progress
    this.$('#rail').querySelectorAll('.rail-step').forEach((el, j) => {
      el.classList.toggle('active', j === i);
      el.classList.toggle('done', j < i);
      el.querySelector('button').setAttribute('aria-selected', String(j === i));
    });
    this.$('#rail').querySelector('.rail-step.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const vk = tab.id + (sub ? ':' + sub : '');
    this.progress.visited = { ...(this.progress.visited || {}), [vk]: Math.max(this.progress.visited?.[vk] || 0, i + 1) };
    saveProgress(L.slug, this.progress);

    await this.renderScene(step.scene, step.state, { instant: first, animateIn: !first });
  }

  // Numeric metric chips count from the old value to the new one instead of snapping.
  countMetrics(from, to) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const num = v => (typeof v === 'number' ? v : /^-?\d+(\.\d+)?$/.test(String(v).trim()) ? +v : null);
    for (const [k, v] of Object.entries(to)) {
      const a = num(from[k]), b = num(v), el = this.$(`#metrics [data-metric="${CSS.escape(k)}"]`);
      if (a == null || b == null || a === b || !el) continue;
      const dec = Math.max(...[from[k], v].map(x => (String(x).split('.')[1] || '').length)), t0 = performance.now();
      const run = now => { const t = Math.min(1, (now - t0) / 520), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        el.textContent = (a + (b - a) * e).toFixed(dec); if (t < 1 && el.isConnected) requestAnimationFrame(run); else el.textContent = String(v); };
      requestAnimationFrame(run);
    }
  }

  async ensureStage(sceneId) {
    const style = this.styleFor(this.route?.tab);
    if (this.stage && this.stage.sceneId === sceneId && this.stage.style === style) return this.stage;
    const token = ++this.mountToken;
    if (this.stage?.inst) { try { this.stage.inst.destroy(); } catch (e) { console.error(e); } }
    this.stage = null; this.prevState = null;
    const el = this.$('#stage');
    el.innerHTML = '';
    let scene = this.scenes[sceneId];
    if (!scene) throw new Error(`Scene "${sceneId}" is not defined in scenes.js`);
    let mode = scene.mode || 'svg', badge = '';
    let inst;
    if (mode === 'three') {
      if (webglAvailable()) {
        inst = await createThreeKit(el);
        badge = `${icon('cube', 14)} Drag to rotate`;
      } else {
        const fb = scene.fallback && this.scenes[scene.fallback];
        if (!fb) throw new Error(`WebGL is unavailable and scene "${sceneId}" has no fallback`);
        scene = fb; mode = 'svg';
        badge = `${icon('info', 14)} 3D unavailable on this device, showing 2D`;
      }
    }
    if (mode === 'svg') {
      inst = createKit(el, { label: scene.label || sceneId, style: style === '3d' && !webglAvailable() ? 'isometric' : style, ...(scene.view || {}) });
      if (style === '3d' && webglAvailable()) {
        try { const mesh = await createIsoMesh(el, inst); if (token === this.mountToken) inst.attachMesh(mesh); else mesh.destroy(); }
        catch (e) { console.error(e); }
      }
    }
    if (token !== this.mountToken) { inst.destroy(); return null; }
    if (badge) el.insertAdjacentHTML('beforeend', `<div class="stage-badge">${badge}</div>`);
    scene.mount?.(el, inst);
    this.stage = { sceneId, scene, inst, el, mode, style };
    return this.stage;
  }

  async renderScene(sceneId, state, { instant = false, duration, animateIn = false } = {}) {
    try {
      const st = await this.ensureStage(sceneId);
      if (!st) return;
      const prev = this.prevState;
      const inst = st.inst;
      const saved = inst.duration;
      if (instant || (!prev && !animateIn)) inst.duration = 0;
      else if (duration != null) inst.duration = Math.min(saved, duration);
      st.scene.render(structuredClone(state || {}), prev, inst);
      if (st.mode === 'three' && state?.camera) inst.applyCamera?.(state.camera);
      inst.duration = saved;
      this.prevState = structuredClone(state || {});
      this.syncMotionBtn();
    } catch (e) {
      console.error(e);
      const el = this.$('#stage');
      if (el) el.innerHTML = `<div class="stage-error">This scene failed to render: ${esc(e.message)}</div>`;
      this.stage = null;
    }
  }

  async replay() {
    const { tab, sub, step } = this.route;
    const steps = this.stepsOf(tab, sub);
    const cur = steps[step - 1], prev = steps[step - 2];
    if (prev && prev.scene === cur.scene && this.stage) {
      await this.renderScene(prev.scene, prev.state, { instant: true });
      setTimeout(() => this.renderScene(cur.scene, cur.state), 60);
    } else {
      this.teardownStageOnly();
      await this.renderScene(cur.scene, cur.state, { animateIn: true });
    }
  }
  teardownStageOnly() {
    this.mountToken++;
    if (this.stage?.inst) this.stage.inst.destroy();
    this.stage = null; this.prevState = null;
  }

  toggleAutoplay() { this.autoplay ? this.stopAutoplay() : this.startAutoplay(); }
  startAutoplay() {
    const btn = this.$('#play-btn');
    if (!btn) return;
    const steps = this.stepsOf(this.route.tab, this.route.sub);
    if (this.route.step >= steps.length) this.go(this.route.tab.id, this.route.sub, 1);
    btn.innerHTML = `${icon('pause', 16)}<span>Pause</span>`;
    const next = () => {
      const s = this.stepsOf(this.route.tab, this.route.sub);
      this.autoplay = setTimeout(() => {
        if (this.route.step >= s.length) return this.stopAutoplay();
        this.stepBy(1); next();
      }, autoplayMs(s[this.route.step - 1]));
    };
    next();
  }
  stopAutoplay() {
    clearTimeout(this.autoplay); this.autoplay = null;
    const btn = this.$('#play-btn');
    if (btn) btn.innerHTML = `${icon('play', 16)}<span>Play</span>`;
  }

  // ---------- playground ----------
  renderPlayground(tab, narr) {

      const state = { ...(tab.state || {}), ...values };

      const metrics = scene?.metrics?.(state) || {};
      this.$('#metrics').innerHTML = Object.entries(metrics).map(([k, v]) => `<span class="metric">${esc(k)} <b>${esc(v)}</b></span>`).join('');

          values[c.id] = JSON.parse(b.dataset.v);
          inp.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          update();
        }));
      } else if (c.type === 'toggle') {
        inp.addEventListener('change', () => { values[c.id] = inp.checked; update(); });
      } else {
        inp.addEventListener('input', () => {
          values[c.id] = +inp.value;
          narr.querySelector(`output[for="ctl-${c.id}"]`).textContent = `${inp.value}${c.unit || ''}`;
          update();

    if (c.type === 'toggle') return `<div class="control"><label><span>${esc(c.label)}</span><input type="checkbox" data-ctl="${esc(c.id)}" ${c.value ? 'checked' : ''}></label></div>`;
    return `<div class="control"><label for="ctl-${esc(c.id)}"><span>${esc(c.label)}</span><output for="ctl-${esc(c.id)}">${esc(c.value)}${esc(c.unit || '')}</output></label>

  // ---------- keyboard ----------
  bindKeys() {
    addEventListener('keydown', e => {
      if (e.target.closest('input, textarea, select, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') { this.stopAutoplay(); this.stepBy(1); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { this.stopAutoplay(); this.stepBy(-1); e.preventDefault(); }
      else if (e.key === ' ' && STEPPER_KINDS.has(this.route?.tab.kind)) { this.toggleAutoplay(); e.preventDefault(); }
      else if (e.key === 'r' || e.key === 'R') { if (STEPPER_KINDS.has(this.route?.tab.kind)) this.replay(); }
      else if (/^[1-9]$/.test(e.key)) { const t = this.tabs[+e.key - 1]; if (t) this.go(t.id, null, null); }
      else if (e.key === '/') { this.$('.search input').focus(); e.preventDefault(); }
    });
  }

  // ---------- search ----------
  bindSearch() {
    const input = this.$('.search input'), box = this.$('.search-results');
    const items = [];
    for (const n of this.nav.topics) if (!n.self) items.push({ title: n.title, kind: 'topic', href: n.href });
    for (const t of this.tabs) {
      if (t.kind === 'stepper') t.steps.forEach((s, i) => items.push({ title: s.title, kind: t.title, href: this.hashFor(t.id, null, i + 1) }));
      if (t.kind === 'lessons') t.lessons.forEach(l => l.steps.forEach((s, i) => items.push({ title: s.title, kind: l.title, href: this.hashFor(t.id, l.id, i + 1) })));
    }
    const run = () => {
      const q = input.value.trim().toLowerCase();
      if (!q) { box.classList.remove('open'); return; }
      const hits = items.filter(it => it.title.toLowerCase().includes(q)).slice(0, 12);
      box.innerHTML = hits.length ? hits.map(h => h.href ? `<a href="${esc(h.href)}">${esc(h.title)}<small>${esc(h.kind)}</small></a>`
        : '').join('') : '<div class="empty">No matches</div>';
      box.classList.add('open');
      box.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', () => { input.value = ''; box.classList.remove('open'); }));
    };
    input.addEventListener('input', run);
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { input.value = ''; box.classList.remove('open'); input.blur(); }
      if (e.key === 'Enter') box.querySelector('a')?.click();
    });
    addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.remove('open'); });
  }
}

<script type="text/plain" data-module="unfold/scenes">// Original schematic diagrams. Stable keys carry cards, vectors and cells between states.
// The reconciler supplies tweening, draw-on and reduced-motion still frames.
const X = [-220, -110, 0, 110, 220];
const WORDS = ['The', '[MASK]', 'chased', 'the', 'mouse.'];
function text(k, id, x, y, value, extra = {}) {
  k.text(id, { x, y, text: value, size: 15, color: 'ink', ...extra });
}
function card(k, id, x, y, label, color = 'blue', extra = {}) {
  k.rect(id, { x: x - 46, y, w: 92, h: 40, r: 7, fill: `${color}-soft`,
    stroke: `${color}-ink`, label, labelSize: 16, draw: true, ...extra });
}
function vector(k, id, x, base, seed, color = 'blue', phase = 'effect') {
  let d = '';
  for (let j = 0; j < 5; j++) {
    const h = 9 + ((seed * 11 + j * 7) % 25);
    const bx = x - 24 + j * 12;
    d += `M ${bx} ${base} L ${bx} ${base - h} `;
  }
  k.path(id, { d, stroke: color, width: 7, fill: 'none', phase, draw: true });
}
function cross(k, id, x, y, r = 12) {
  k.line(id + '-a', { x1: x - r, y1: y - r, x2: x + r, y2: y + r, color: 'red', width: 3, draw: true });
  k.line(id + '-b', { x1: x - r, y1: y + r, x2: x + r, y2: y - r, color: 'red', width: 3, draw: true });
}
function grid(k, id, x, y, n, local = false, cell = 9) {
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const allowed = !local || Math.abs(r - c) <= 1;
    k.rect(`${id}-${r}-${c}`, { x: x + c * cell, y: y + r * cell,
      w: cell - 1, h: cell - 1, r: 0, fill: allowed ? 'blue' : 'surface-2',
      stroke: 'none', phase: 'cause', enter: 'grow' });
  }
}

            color: 'blue-ink', phase: 'effect', draw: true });
          if (i === 0) {
            for (let j = 0; j < 4; j++) {
              k.line('position-' + j, { x1: -225 + j * 38, y1: y + 38, x2: -225 + j * 38, y2: y - j * 5,
                width: 10, color: 'blue', draw: true });
              const a = j * 0.6 - 1.3, cx = 100 + j * 42;
              k.circle('rotation-' + j, { x: cx, y: y + 15, r: 17, fill: 'none', stroke: 'line-strong', draw: true });
              k.sarrow('rotary-' + j, { x1: cx, y1: y + 15, x2: cx + Math.cos(a) * 15,
                y2: y + 15 + Math.sin(a) * 15, color: 'blue-ink', phase: 'effect', draw: true });
            }
          } else if (i === 1) {
            k.path('old-activation', { d: `M -230 ${y + 32} Q -160 ${y + 32} -105 ${y - 10}`,
              stroke: 'blue-ink', width: 3, fill: 'none', draw: true });
            k.sarrow('gate-in', { x1: 85, y1: y + 17, x2: 230, y2: y + 17, color: 'blue-ink', draw: true });
            k.line('gate', { x1: 160, y1: y - 5, x2: 174, y2: y + 4, color: 'yellow-ink', width: 7, phase: 'effect' });
            k.circle('gate-pivot', { x: 160, y: y - 5, r: 5, fill: 'yellow' });
          } else {
            card(k, 'old-block', -210, y - 4, 'Block', 'blue', { w: 74, x: -247, labelSize: 13 });
            card(k, 'old-norm', -115, y - 4, 'Norm', 'blue', { w: 74, x: -152, labelSize: 13 });
            card(k, 'new-norm', 110, y - 4, 'Norm', 'blue', { w: 74, x: 73, labelSize: 13, phase: 'effect' });
            card(k, 'new-block', 210, y - 4, 'Block', 'blue', { w: 74, x: 173, labelSize: 13, phase: 'effect' });
          }
        });
      } else if (p === 2) {
        k.timeline('training', { events: [{ when: '1.7T tokens', title: 'Length 1024' },
          { when: '+300B tokens', title: 'Length 8192' }], now: 1, x0: -185, x1: 185, y: -108 });
        text(k, 'trained-total', 0, -8, '2 trillion training tokens', { size: 19, phase: 'effect' });
        const rows = [{ name: 'BERT', count: 512, y: 60 }, { name: 'ModernBERT', count: 8192, y: 155 }];
        rows.forEach((r, i) => {
          text(k, 'context-name-' + i, -265, r.y - 20, r.name, { anchor: 'start', size: 15 });
          k.line('capacity-track-' + i, { x1: -265, x2: 265, y1: r.y, y2: r.y, color: 'line', width: 16 });
          k.line('capacity-' + i, { x1: -265, x2: -265 + 530 * r.count / 8192,
            y1: r.y, y2: r.y, width: 16, color: 'blue', phase: 'effect', draw: true });
          text(k, 'capacity-value-' + i, 265, r.y + 27, `${r.count} tokens`, { size: 14, mono: true, anchor: 'end', phase: 'evidence' });
        });
      } else if (p === 3) {
        text(k, 'n-small', -220, -182, 'n = 8', { mono: true });
        text(k, 'n-large', 120, -182, 'n = 16', { mono: true });
        text(k, 'pair-count', 0, -150, 'Global: 64 → 256 pairs = 4×', { size: 17 });
        grid(k, 'global-small', -257, -125, 8);
        grid(k, 'global-large', 48, -125, 16);
        k.sarrow('global-growth', { x1: -125, y1: -75, x2: 12, y2: -75, color: 'blue-ink', draw: true, phase: 'effect' });
        text(k, 'local-count', 0, 43, 'Local: fixed toy window ≈ 2× work', { size: 17, phase: 'effect' });
        grid(k, 'local-small', -257, 65, 8, true);
        grid(k, 'local-large', 48, 65, 16, true);
        k.sarrow('local-growth', { x1: -125, y1: 115, x2: 12, y2: 115, color: 'blue-ink', draw: true, phase: 'effect' });
      } else if (p === 4) {
        const lengths = [7, 4, 2], colors = ['blue', 'purple', 'blue'];
        text(k, 'padded-label', 0, -173, 'Padded batch: empty slots still cost work', { size: 17 });
        let packed = 0;
        lengths.forEach((n, r) => {
          for (let c = 0; c < 7; c++) {
            const x = -245 + c * 72, y = -140 + r * 55;
            k.circle(`slot-${r}-${c}`, { x, y, r: 17, fill: c < n ? colors[r] : 'surface-2',
              stroke: c < n ? colors[r] + '-ink' : 'line-strong', label: c < n ? '' : '–' });
            if (c < n) {
              const dst = -264 + packed * 44;
              k.circle(`packed-${r}-${c}`, { x: dst, y: 125, r: 16, fill: colors[r], stroke: colors[r] + '-ink',
                phase: 'effect', enter: 'drop' });
              packed++;
            } else {
              k.sarrow(`padding-exit-${r}-${c}`, { x1: x, y1: y + 18, x2: x + 12, y2: y + 34,
                color: 'red-ink', width: 1.5, phase: 'cause', draw: true });
            }
          }
        });
        k.sarrow('pack-arrow', { x1: 0, y1: 14, x2: 0, y2: 63, color: 'blue-ink', draw: true, phase: 'cause' });
        text(k, 'packed-label', 0, 86, 'Packed tokens · sequence boundaries stay', { size: 17, phase: 'effect' });
        [22, 198].forEach((x, i) => k.line('boundary-' + i, { x1: x, x2: x, y1: 100, y2: 150, color: 'ink', width: 3, phase: 'effect', draw: true }));
        text(k, 'isolation', 0, 192, 'Separate documents do not become one context', { size: 16, phase: 'evidence' });
      } else if (p === 5) {
        grid(k, 'io-grid', -270, -145, 8, false, 26);
        if (k.reduced) k.rect('tile', { x: -270 + 3 * 26, y: -145 + 4 * 26, w: 52, h: 52,
          fill: 'yellow-soft', stroke: 'yellow-ink', opacity: 0.85, draw: true, phase: 'cause' });
        text(k, 'grid-label', -167, 95, 'All global pairs remain', { size: 15 });
        k.path('tile-sweep', { d: 'M -258 -132 L -76 -132 L -76 50 L -258 50',
          stroke: 'yellow-ink', dashed: true, fill: 'none', width: 2, draw: true, phase: 'effect' });
        card(k, 'gpu-hbm', 160, -140, 'GPU memory', 'blue', { x: 55, w: 210, h: 55 });
        card(k, 'gpu-sram', 160, 20, 'On-chip tiles', 'blue', { x: 55, w: 210, h: 55, phase: 'effect' });
        k.sarrow('load', { x1: 125, y1: -72, x2: 125, y2: 5, color: 'blue-ink', width: 3, draw: true, phase: 'effect' });
        k.sarrow('store', { x1: 200, y1: 5, x2: 200, y2: -72, color: 'blue-ink', width: 3, draw: true, phase: 'effect' });
        text(k, 'traffic', 160, 106, 'Load once; reuse', { size: 17 });
        text(k, 'io-note', 0, 180, 'Exact attention · IO-aware computation', { size: 19, phase: 'evidence' });
      } else {
        k.pipeline('task-route', { stages: ['Token states', 'Adaptation', 'Task output'],
          active: 1, width: 560, y: -132, note: 'Head or retrieval training' });
        text(k, 'not-generator', 0, -38, 'Not a next-token chat generator', { size: 17 });
        text(k, 'benchmark-title', 0, 5, 'Authors’ GLUE comparison · large models', { size: 16 });
        const rows = [{ name: 'ModernBERT', v: 90.4, y: 62, color: 'blue' },
          { name: 'DeBERTaV3', v: 91.4, y: 130, color: 'purple' }];
        rows.forEach((r, i) => {
          text(k, 'bench-label-' + i, -270, r.y - 21, r.name, { anchor: 'start', size: 14 });
          k.line('bench-track-' + i, { x1: -270, y1: r.y, x2: 220, y2: r.y, width: 18, color: 'line' });
          k.line('bench-bar-' + i, { x1: -270, y1: r.y, x2: -270 + r.v * 4.9, y2: r.y,
            color: r.color, width: 18, phase: 'evidence', draw: true });
          text(k, 'bench-value-' + i, 265, r.y + 4, String(r.v), { size: 16, mono: true, phase: 'evidence' });
        });
        text(k, 'benchmark-scope', 0, 193, '0–100 scale · original comparison, not a current ranking', { size: 14 });
      }
      k.end();
      // Ambient demonstrations supplement, never replace, the complete static diagram.
      // Owned SVG is necessary for many synchronized particles and a pauseable tiled sweep.
      if (!k.reduced && (p === 4 || p === 5)) {
        const ns = 'http://www.w3.org/2000/svg';
        const make = (name, attrs) => {
          const el = document.createElementNS(ns, name);
          for (const [a, value] of Object.entries(attrs)) el.setAttribute(a, value);
          this.flow.appendChild(el);
          return el;
        };
        const epoch = performance.now(), colors = k.colors();
        if (p === 4) {
          let packed = 0;
          const travelers = [];
          [7, 4, 2].forEach((n, r) => {
            for (let c = 0; c < n; c++) travelers.push({
              el: make('circle', { r: 6, fill: colors.yellow, stroke: colors['yellow-ink'] }),
              x0: -245 + c * 72, y0: -140 + r * 55, x1: -264 + packed++ * 44,
            });
          });
          k.loop(now => {
            const cycle = ((now - epoch) / (k.motion.reveal * 5)) % 1;
            travelers.forEach((v, i) => {
              const t = Math.max(0, Math.min(1, (cycle * 1.6 - i * 0.015)));
              const e = t * t * (3 - 2 * t);
              v.el.setAttribute('cx', v.x0 + (v.x1 - v.x0) * e);
              v.el.setAttribute('cy', v.y0 + (125 - v.y0) * e);
              v.el.setAttribute('opacity', t > 0 && t < 1 ? '1' : '0');
            });
          });
        } else {
          const tile = make('rect', { x: -270, y: -145, width: 52, height: 52,
            fill: colors['yellow-soft'], 'fill-opacity': 0.7, stroke: colors['yellow-ink'], 'stroke-width': 3 });
          const transfer = make('circle', { cx: 125, cy: -72, r: 6,
            fill: colors.yellow, stroke: colors['yellow-ink'] });
          k.loop(now => {
            const beat = (now - epoch) / (k.motion.reveal * 2);
            const ix = Math.floor(beat) % 16;
            tile.setAttribute('x', -270 + (ix % 4) * 52);
            tile.setAttribute('y', -145 + Math.floor(ix / 4) * 52);
            transfer.setAttribute('cy', -72 + Math.min(1, (beat % 1) * 3) * 77);
            transfer.setAttribute('opacity', beat % 1 < 0.34 ? '1' : '0');
          });
        }
      }
    },
  },
};
</script>

  const map = document.createElement('script'); map.type = 'importmap'; map.textContent = JSON.stringify({ imports }); document.head.appendChild(map);

})();
</script>
