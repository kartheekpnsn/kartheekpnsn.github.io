:root {
  --bg: #FAFAF8; --surface: #FFFFFF; --surface-2: #F3F3F0; --ink: #1B1B1F; --ink-2: #3A3A40; --muted: #737373;
  --line: #E6E6E1; --line-strong: #D4D4CE; --dot: #D9D9D3;
  /* accents as fills */
  --red: #F25022; --green: #7FBA00; --blue: #00A4EF; --yellow: #FFB900;
  /* accents as text/lines (contrast-tuned per mode) */
  --red-ink: #C43E1C; --green-ink: #3F7D00; --blue-ink: #0067B8; --yellow-ink: #8A6100;
  --red-soft: #FDECE6; --green-soft: #EEF6E0; --blue-soft: #E3F4FC; --yellow-soft: #FFF5DB;
  --purple: #8661C5; --purple-ink: #6A44A8; --purple-soft: #F0EAF9;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 4px 16px rgba(20,20,30,.05);
  --radius: 10px; --radius-sm: 6px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --tree-w: 248px; --narr-w: 380px; --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171A; --surface: #1F2024; --surface-2: #26272C; --ink: #EDEDED; --ink-2: #CFCFD2; --muted: #9A9A9A;
    --line: #2E2F35; --line-strong: #3B3C43; --dot: #34353C;
    --red: #F25022; --green: #7FBA00; --blue: #00A4EF; --yellow: #FFB900;
    --red-ink: #FF7A50; --green-ink: #9BD23C; --blue-ink: #4CC2FF; --yellow-ink: #FFC83D;
    --red-soft: #3A2019; --green-soft: #26321A; --blue-soft: #14303D; --yellow-soft: #3A3019;
    --purple-ink: #B79CF0; --purple-soft: #2A2238;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16171A; --surface: #1F2024; --surface-2: #26272C; --ink: #EDEDED; --ink-2: #CFCFD2; --muted: #9A9A9A;
  --line: #2E2F35; --line-strong: #3B3C43; --dot: #34353C;
  --red-ink: #FF7A50; --green-ink: #9BD23C; --blue-ink: #4CC2FF; --yellow-ink: #FFC83D;
  --red-soft: #3A2019; --green-soft: #26321A; --blue-soft: #14303D; --yellow-soft: #3A3019;
  --purple-ink: #B79CF0; --purple-soft: #2A2238;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--blue-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
code, kbd, pre, .mono { font-family: var(--mono); font-size: .9em; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { flex: none; vertical-align: -4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; height: var(--top-h); display: flex; align-items: center; gap: 16px;
  padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 18px; height: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; transform: rotate(45deg) scale(.82); }
.brand-mark i { display: block; border-radius: 1.5px; }
.brand-mark i:nth-child(1) { background: var(--red); } .brand-mark i:nth-child(2) { background: var(--green); }
.brand-mark i:nth-child(3) { background: var(--blue); } .brand-mark i:nth-child(4) { background: var(--yellow); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border: 0; background: none; border-radius: 8px;
  color: var(--muted); white-space: nowrap; font-size: 13.5px; font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.tab[aria-selected="true"] .ic { color: var(--blue-ink); }
.tab .num { font: 11px var(--mono); color: var(--muted); opacity: .7; }

<script type="application/json" id="unfold-lesson">{"slug":"modernbert","title":"ModernBERT","duration":"30m","level":"beginner","domain":"ai-ml","summary":"Understand ModernBERT as a modern bidirectional encoder, trace its token representations, and explain its strengths and limitations in an interview.","playerVersion":"1.1.0","style":"isometric","altStyles":["line"],"sourcesAccessed":"2026-11-25","objectives":["Trace text through subword tokens to one contextual vector per token. [S1][S2]","Contrast bidirectional masked-token learning with causal next-token prediction. [S3]","Distinguish local/global attention, unpadding and FlashAttention without calling the full stack linear-time. [S4][S6]","Describe the trained context length and main architecture changes. [S4][S5][S7]","Choose a task adaptation path and qualify benchmark or speed claims. [S4][S8][S9]"],"tabs":[{"id":"eli5","title":"ELI5","kind":"stepper","icon":"lightbulb","style":"sketch","steps":[{"title":"A clue with a missing piece","scene":"clue","state":{"phase":1},"narration":"Picture a clue: “The [MASK] chased the mouse.” You have to recover the missing piece, not write a whole reply. Learning from missing-word clues is the idea behind this family of models. [S3]","whatChanged":["+ A missing piece becomes the target"]},{"title":"Clues arrive from both sides","scene":"clue","state":{"phase":2},"narration":"“The” gives one clue; “chased the mouse” gives another. You can use words before and after the blank together. A next-word writer, by contrast, cannot use later words when predicting the next word. [S3]","whatChanged":["~ Both sides inform the missing piece"]},{"title":"The same word can mean something else","scene":"clue","state":{"phase":3},"narration":"Keep the clue-solving idea, but look at “bank.” A river bank and a bank approving a loan share the spelling, not the meaning. The surrounding words change the model's numerical description of that word. It learns a description for this use, not one fixed meaning for every use. [S2][S3]","whatChanged":["~ Different clues produce different descriptions"]},{"title":"Name the mechanism","scene":"clue","state":{"phase":4},"narration":"The clue solver is a **bidirectional encoder**: it represents input using context on both sides. Its missing-piece training is **masked language modeling**. Those numerical descriptions are **contextual vectors**. ModernBERT modernizes this family; its released checkpoint is not a next-word chat generator. [S3][S8]","callout":{"kind":"good-to-know","text":"After task adaptation, an encoder can support classification and retrieval. [S8]"},"whatChanged":["+ Words lead to contextual vectors","- A chat reply is not the default output"]}]},{"id":"core","title":"Core Mechanism","kind":"stepper","icon":"layer","steps":[{"title":"Text becomes pieces, not always words","scene":"encoder-flow","state":{"phase":1},"narration":"Start with “The playful cat slept.” A **tokenizer** maps text to vocabulary pieces, then integer IDs. Pieces may be smaller than words. ModernBERT uses a modified BPE tokenizer, not original BERT's WordPiece tokenizer. The split and IDs here illustrate the process only. [S1][S4]","callout":{"kind":"warning","text":"These schematic pieces and IDs are not verified ModernBERT tokenizer output."},"whatChanged":["+ Text becomes a sequence of token IDs"]},{"title":"Give each token a vector","scene":"encoder-flow","state":{"phase":2},"narration":"Each token gets a **vector**, an ordered list of numbers the network can transform. Each little bundle represents one such list; it does not show the actual hidden width or actual values. Keep two counts separate: how many tokens you have, and how many numbers describe each token. [S2]","whatChanged":["+ Every input token has its own vector"]},{"title":"Nearby tokens exchange information","scene":"encoder-flow","state":{"phase":3},"narration":"**Attention** combines information from other token vectors. In a **local** layer, each position uses a nearby window, in both directions. ModernBERT reports a 128-token local window. The few arrows here illustrate nearby exchange, not the real window's size or learned weights. [S4]","whatChanged":["~ Nearby information changes token vectors"]},{"title":"A global layer connects distant clues","scene":"encoder-flow","state":{"phase":4},"narration":"Every third layer uses **global attention**, allowing direct interaction across the sequence; the other layers are local. A faraway clue can now directly influence a token. The three sheets summarize that pattern, not the entire network. Not every layer sees the whole document directly. [S4]","callout":{"kind":"insight","text":"Information also travels farther as local layers stack; global layers add direct distant connections. [S4]"},"whatChanged":["+ A global layer connects distant positions"]},{"title":"Context changes the token vectors","scene":"encoder-flow","state":{"phase":5},"narration":"The encoder returns a contextual vector for each input token, not a row of generated words. Its output axes are **batch** (sequences processed together), **tokens** (positions per sequence), and **hidden width** (numbers per position). Context changes the values while the token-position count stays the same. [S2][S3]","formula":"(batch, tokens, hidden width)","whatChanged":["~ Contextual output vectors retain one position per token"]},{"title":"Learn by recovering hidden tokens","scene":"encoder-flow","state":{"phase":6},"narration":"During pretraining, selected token identities are hidden or corrupted. A prediction head learns to recover their original identities using surrounding context. ModernBERT uses a **30% masking rate** and no next-sentence prediction objective. One hidden token here is illustrative, not a five-token demonstration of exactly 30%. [S4]","whatChanged":["~ A selected identity is hidden","+ A prediction head learns to recover it"]},{"title":"Adapt the backbone to the task","scene":"encoder-flow","state":{"phase":7},"narration":"For classification, add a task head that predicts labels. For single-vector retrieval, **pooling** combines token states into one vector, and retrieval training teaches relevant pairs to match. **Full fine-tuning** can update the encoder backbone too; training need not stop at the new head. [S3][S4][S8]","whatChanged":["+ Task-specific heads or pooling use token states","~ Full fine-tuning can update the backbone"]},{"title":"Failure mode: token states are not search-ready","scene":"encoder-flow","state":{"phase":8},"narration":"A bare encoder does not automatically return one search-ready document embedding. Arbitrary pooling alone does not establish retrieval quality. Use a retrieval-trained derivative or train and validate the pooling/scoring pipeline. For example, Nomic's ModernBERT derivative specifies query/document prefixes, pooling and normalization. [S2][S4][S9]","callout":{"kind":"warning","text":"Choose a retrieval-trained checkpoint or train the pooling/scoring pipeline. Follow that checkpoint's instructions. [S9]"},"whatChanged":["- Direct use as a search-ready vector is blocked","+ Explicit adaptation bridges the gap"]}]},{"id":"technical","title":"Technical","kind":"stepper","icon":"math-formula","style":"line","steps":[{"title":"Modern ingredients, same encoder family","scene":"technical-board","state":{"phase":1},"narration":"ModernBERT replaces BERT's absolute position embeddings with **RoPE**, which represents position using rotations. [S4][S5][S7] It also uses **GeGLU**, a gated feed-forward activation, and **pre-normalization**, applying LayerNorm before a block. These modernize an encoder; they do not turn it into a causal decoder. [S4]","callout":{"kind":"good-to-know","text":"Base: 149M parameters, 22 layers. Large: 395M parameters, 28 layers. [S4]"},"whatChanged":["~ Position handling, activation and normalization change"]},{"title":"Long context is trained, not toggled","scene":"technical-board","state":{"phase":2},"narration":"Training first uses **1.7 trillion tokens at length 1024**, then **300 billion at length 8192**. Long context is explicitly trained. [S4] Standard BERT's 512 positions contrast with ModernBERT's trained 8192-token context: 16 times the capacity, measured in tokens, not words. [S1][S4][S7]","callout":{"kind":"warning","text":"RoPE alone does not grant unlimited context. A larger length setting is not a substitute for context-extension training. [S4][S5]"},"whatChanged":["+ Training extends the supported context","~ Capacity grows from 512 to 8192 tokens"]},{"title":"Why the full stack is not linear","scene":"technical-board","state":{"phase":3},"narration":"Let **n** be token count and **w** a fixed local-window width, at fixed hidden width. Global attention considers roughly n² pairs; local attention roughly n·w. Doubling n gives 64 → 256 global pairs in this toy example, but about twice the local work. Retained global layers prevent a linear full-stack claim. [S4]","formula":"global pairs ≈ n²; local pairs ≈ n·w","callout":{"kind":"warning","text":"This counts token-pair work, not full wall-clock complexity. The toy local band is not the real 128-token window. [S4]"},"whatChanged":["~ Doubling tokens quadruples global pairs"]},{"title":"Remove padding, preserve boundaries","scene":"technical-board","state":{"phase":4},"narration":"Batches often pad shorter sequences with empty slots. **Unpadding** removes this empty-token work before embedding; variable-length attention preserves each sequence's boundary. Packing real tokens together is not permission for unrelated documents to attend to each other. Outputs can be padded again when needed. [S4]","whatChanged":["- Empty padding work is removed","~ Sequence boundaries remain intact"]},{"title":"FlashAttention saves memory traffic","scene":"technical-board","state":{"phase":5},"narration":"**FlashAttention** computes exact attention using IO-aware tiles: it reuses on-chip data to reduce transfers to GPU high-bandwidth memory. It changes how allowed pairs are computed, not which pairs are allowed. Local attention instead restricts the pair graph. Unpadding skips empty positions. These solve different sources of waste. [S4][S6]","callout":{"kind":"good-to-know","text":"Current official docs require explicitly selecting FlashAttention2 for padding-free operation. Check hardware and software support. [S2]"},"whatChanged":["~ Tiling reuses data without removing allowed pairs"]},{"title":"Choose the job, then check the evidence","scene":"technical-board","state":{"phase":6},"narration":"Use this bidirectional encoder for adapted classification or retrieval, not next-token chat. [S8][S9] The authors report GLUE-large scores of ModernBERT **90.4**, DeBERTaV3 **91.4**: not a universal win. [S8] Quality and speed depend on task, adaptation, lengths and hardware; original BERT-base is faster on fixed short inputs in their throughput comparison. [S4]","callout":{"kind":"warning","text":"The authors' RTX 4090 results are workload-specific, not a promised speedup. Training is English-focused and may carry web-data bias. The release announcement is historical framing, not independent replication. [S4][S8][S10]"},"whatChanged":["+ Task adaptation sits between backbone and application","~ The reported comparison includes a counterexample"]}]},{"id":"check","title":"Check Yourself","kind":"quiz","icon":"question-circle"},{"id":"related","title":"Related & Sources","kind":"related","icon":"document-text"}],"quiz":[{"concept":"output-shape","q":"A bare encoder processes 20 tokens. What does its final hidden-state output contain?","options":["One trained relevance score per document","One contextual vector per input token","One generated answer per input token","One search-ready vector per document"],"answer":1,"why":"Token states have shape batch × sequence length × hidden width. Pooling and task training are separate. [S2][S4]"},{"concept":"masked-versus-causal","q":"Which context can inform a hidden token during bidirectional masked-language learning?","options":["Only the tokens following the hidden position","Only the tokens preceding the hidden position","Only the unchanged embedding of the hidden token","Tokens on both sides of the hidden position"],"answer":3,"why":"Masked language modeling uses context on both sides. A causal model blocks later-token context. [S3]"},{"concept":"attention-complexity","q":"Why is ModernBERT's complete attention stack not linear in sequence length?","options":["Global layers still consider quadratic token pairs","Subword tokens each require a whole-document vector","Unpadding makes every local window span all tokens","RoPE makes each layer generate tokens sequentially"],"answer":0,"why":"Local layers reduce pair work, but global layers remain. Those global layers retain quadratic token-pair work. [S4]"},{"concept":"efficiency-mechanisms","q":"Which pairing correctly distinguishes two efficiency techniques?","options":["Unpadding removes words; FlashAttention reduces vocabulary","Unpadding shortens vectors; FlashAttention trains pooling","Unpadding skips padding; FlashAttention reduces IO","Unpadding removes layers; FlashAttention masks targets"],"answer":2,"why":"Padding removal and IO-aware exact attention address different waste: empty-token work versus memory traffic. [S4][S6]"},{"concept":"task-adaptation","q":"You need semantic search immediately. What is the sound checkpoint choice?","options":["Base MLM with arbitrary pooling and no validation","Retrieval-trained derivative following its usage recipe","Base MLM with only the maximum-length setting changed","Base MLM with all token vectors silently discarded"],"answer":1,"why":"The base masked-language model is not a complete retrieval model. Derivatives may require prefixes, pooling and normalization. [S8][S9]"},{"concept":"benchmark-evidence","q":"What is a defensible interview claim about ModernBERT's speed and quality?","options":["Longer context guarantees better scores on every task","The reported GPU throughput applies to every CPU","Parameter count alone determines production latency","Results depend on task, training, workload and hardware"],"answer":3,"why":"Original results include quality and throughput counterexamples. Benchmark your target use case rather than promising a universal win. [S4][S8]"}],"related":{"prereqs":[{"id":"tokenization","title":"Tokenization","why":"Understand subword input units."},{"id":"vectors","title":"Vectors","why":"Read one-vector-per-token diagrams."},{"id":"self-attention","title":"Self-Attention","why":"Learn weighted token interactions."}],"next":[{"id":"contrastive-learning","title":"Contrastive Learning","why":"Train embeddings for relevant pairs."},{"id":"colbert","title":"ColBERT","why":"Compare token vectors with late interaction."},{"id":"retrieval-evaluation","title":"Retrieval Evaluation","why":"Measure relevance and test generalization."}]},"sources":[{"id":"S1","title":"Tokenization algorithms","url":"https://huggingface.co/docs/transformers/en/tokenizer_summary","publisher":"Hugging Face","accessed":"2026-11-25","trust":"primary","note":"Official tokenizer documentation; subwords, BPE, and WordPiece."},{"id":"S2","title":"ModernBERT — Transformers documentation","url":"https://huggingface.co/docs/transformers/en/model_doc/modernbert","publisher":"Hugging Face","accessed":"2026-11-25","trust":"primary","note":"Read overview and API output sections; token-state shapes and current explicit FlashAttention2 requirement for padding-free operation. Page links v5.24.1 implementation."},{"id":"S3","title":"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding","url":"https://arxiv.org/html/1810.04805v2","publisher":"Devlin et al. / arXiv","accessed":"2026-11-25","trust":"primary","note":"Original paper; read introduction and architecture/pretraining sections for contextual vectors, bidirectionality, causal comparison, and full-network fine-tuning."},{"id":"S4","title":"Smarter, Better, Faster, Longer: A Modern Bidirectional Encoder for Fast, Memory Efficient, and Long Context Finetuning and Inference","url":"https://arxiv.org/html/2412.13663v2","publisher":"Warner et al. / arXiv","accessed":"2026-11-25","trust":"primary","note":"Read main paper through limitations, including methods and Tables 1–2. Primary basis for architecture, training, task adaptation, benchmark caveats, and workload-specific RTX 4090 throughput; not independent replication."},{"id":"S5","title":"RoFormer: Enhanced Transformer with Rotary Position Embedding","url":"https://arxiv.org/abs/2104.09864","publisher":"Su et al. / arXiv","accessed":"2026-11-25","trust":"primary","note":"Read abstract and submission history; rotational positional encoding and relative dependence, initial submission in 2021. No detailed derivation claimed."},{"id":"S6","title":"FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness","url":"https://arxiv.org/abs/2205.14135","publisher":"Dao et al. / arXiv","accessed":"2026-11-25","trust":"primary","note":"Read abstract and submission history; exact attention, tiling, memory traffic, and original 2022 submission. No ModernBERT-specific speedup inferred from this paper."},{"id":"S7","title":"BERT — Transformers documentation","url":"https://huggingface.co/docs/transformers/en/model_doc/bert","publisher":"Hugging Face","accessed":"2026-11-25","trust":"primary","note":"Read overview, configuration, and tokenizer sections; standard BERT's absolute positional embeddings and 512-position baseline."},{"id":"S8","title":"answerdotai/ModernBERT-base — Model card","url":"https://huggingface.co/answerdotai/ModernBERT-base","publisher":"Answer.AI and LightOn / Hugging Face","accessed":"2026-11-25","trust":"primary","note":"Read model summary, usage, evaluation, training, and limitations; fill-mask versus downstream fine-tuning, exact benchmark counterexample, English and bias limitations."},{"id":"S9","title":"nomic-ai/modernbert-embed-base — Model card","url":"https://huggingface.co/nomic-ai/modernbert-embed-base","publisher":"Nomic AI / Hugging Face","accessed":"2026-11-25","trust":"primary","note":"Read summary and usage sections; independently maintained ModernBERT-based embedding derivative, required query/document prefixes, pooling and normalization. Not an independent reproduction of ModernBERT paper benchmarks."},{"id":"S10","title":"Finally, a Replacement for BERT: Introducing ModernBERT","url":"https://www.answer.ai/posts/2024-12-19-modernbert.html","publisher":"Answer.AI","accessed":"2026-11-25","trust":"primary","note":"Authors' dated release announcement; historical framing and marketing-language comparison. Historical installation advice is superseded by current official docs."}]}</script>

<script type="text/plain" data-module="unfold/util">// Small shared helpers for the player.
export const PLAYER_VERSION = '1.1.0';

export const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Inline markdown-lite: **bold**, *em*, `code`, [S3] citations, [text](url) links, blank-line paragraphs.
export function md(text, sources = [], { block = false } = {}) {
  const byId = Object.fromEntries((sources || []).map(s => [s.id, s]));
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(S\d+)\]/g, (m, id) => {
      const s = byId[id];
      return s ? `<a class="cite" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}${s.publisher ? ' · ' + esc(s.publisher) : ''}">${id}</a>` : `<span class="cite">${id}?</span>`;
    });
  if (!block) return inline(text);
  return String(text ?? '').split(/\n{2,}/).map(p => `<p>${inline(p.trim())}</p>`).join('');
}

// Tiny syntax colouring for pseudocode / py / js. Returns per-line HTML.
const KW = /\b(def|return|if|elif|else|for|while|in|not|and|or|class|self|None|True|False|function|const|let|var|new|throw|raise|import|from|try|except|catch|push|pop|len|null|undefined|of|is|break|continue|lambda|pass)\b/g;
export function highlightLines(src) {
  return String(src).replace(/\t/g, '  ').split('\n').map(line => {
    // find a # or // comment start that is outside quotes
    let q = null, ci = -1;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === q) q = null; continue; }
      if (c === '"' || c === "'") q = c;
      else if (c === '#' || (c === '/' && line[i + 1] === '/')) { ci = i; break; }
    }
    const comment = ci >= 0 ? esc(line.slice(ci)) : '';
    const code = ci >= 0 ? line.slice(0, ci) : line;
    const TOK = new RegExp(`("[^"]*"|'[^']*')|\\b(\\d+(?:\\.\\d+)?)\\b|${KW.source}`, 'g');
    let out = '', last = 0, m;
    while ((m = TOK.exec(code))) {
      out += esc(code.slice(last, m.index));
      const cls = m[1] ? 'tok-s' : m[2] ? 'tok-n' : 'tok-k';
      out += `<span class="${cls}">${esc(m[0])}</span>`;
      last = TOK.lastIndex;
    }
    out += esc(code.slice(last));
    return out + (comment ? `<span class="tok-c">${comment}</span>` : '');
  });
}

export const store = {
  get(key, fallback) { try { const v = localStorage.getItem('unfold:' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, val) { try { localStorage.setItem('unfold:' + key, JSON.stringify(val)); } catch { /* private mode */ } },
};

export function initTheme(btn, onChange) {
  const apply = t => {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    onChange?.();
  };
  apply(store.get('theme', null));
  btn?.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    store.set('theme', next);
    apply(next);
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => onChange?.());
}

export function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

export async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied: ' + t); } catch { toast(t); }
}

export function progressFor(slug) { return store.get('progress:' + slug, { quizBest: null, visited: {} }); }
export function saveProgress(slug, p) { store.set('progress:' + slug, p); }
</script>
<script type="text/plain" data-module="unfold/templates">// Unfold scene templates + shared kit data. No imports and no DOM: the player installs these on the real kit,
// and validate-lesson.mjs installs the same code on its mock kit.
//
// A template draws a whole, common picture from a few props, using only kit primitives, keyed under `key`.
// It follows the motion rules by default: stable keys (things glide), one focal change (the active item),
// labels on the object, everything inside the stage safe area (±320 × ±210).

export const PRIMITIVES = ['box', 'plate', 'token', 'label', 'pointer', 'arrow', 'rect', 'text', 'line', 'sarrow', 'path', 'circle',
  'chart', 'axis', 'linechart', 'scatter', 'person', 'icon'];

// Duration tokens (ms). P2: use these, not ad-hoc timings.
export const MOTION = { quick: 200, state: 520, reveal: 800 };

// Visual styles: a skin over the same scenes. See references/styles/<name>.md.
//   fill: 'solid' (filled, shaded) | 'tint' (light wash + outline) | 'flat' (solid, no outlines)
//   outline: 'self' (each colour's dark ink) | 'ink' (one dark marker)   wobble: px of hand-drawn displacement
//   drawOn: strokes draw themselves when they appear   hand: handwriting font   mesh: three.js boxes
export const STYLES = {
  isometric: { label: 'Clean', fill: 'solid', stroke: 1, wobble: 0, drawOn: false },
  line: { label: 'Line', fill: 'tint', tint: 0.1, outline: 'self', stroke: 1.5, wobble: 0, drawOn: true },
  sketch: { label: 'Sketch', fill: 'tint', tint: 0.38, outline: 'ink', stroke: 1.7, wobble: 2.4, wobbleFreq: 0.028, drawOn: true, hand: true },
  chalk: { label: 'Chalk', fill: 'tint', tint: 0.22, outline: 'self', stroke: 2, wobble: 1.6, wobbleFreq: 0.05, grain: true, drawOn: true, hand: true },
  pictogram: { label: 'Pictogram', fill: 'flat', stroke: 1, wobble: 0, drawOn: false, round: true },
  '3d': { label: '3D', fill: 'solid', stroke: 1, wobble: 0, drawOn: false, mesh: true },
};
export const STYLE_NAMES = Object.keys(STYLES);
export const TEMPLATE_NAMES = ['caption', 'pipeline', 'timeline', 'compare', 'array', 'stack', 'graphWalk', 'chartStory'];

const S = MOTION.state;
const clampText = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

export function installTemplates(kit) {
  // A one-line caption across the top of the stage.
  kit.caption = (text, { color = 'ink-2', key = 'caption' } = {}) => {
    if (text) kit.text(key, { x: 0, y: -212, text, size: 15, weight: 600, color });
  };

  // Stages in a row; the active one lights up and a token glides to it.
  // stages: ['Text', 'Tokens'] | [{ label, sub, color }]; active: index; note: text under the active stage.
  kit.pipeline = (key, { stages = [], active = 0, y = 0, width = 640, h = 46, note, flow = true, color = 'blue' } = {}) => {
    const n = stages.length || 1, gap = 18, w = Math.min(140, (width - gap * (n - 1)) / n), total = n * w + (n - 1) * gap, x0 = -total / 2;
    stages.forEach((st, i) => {
      const s = typeof st === 'string' ? { label: st } : st, x = x0 + i * (w + gap);
      const on = i === active, done = i < active;
      kit.rect(`${key}-s${i}`, { x, y: y - h / 2, w, h, r: 10, fill: on ? (s.color || color) : done ? `${s.color || color}-soft` : 'surface',
        stroke: on ? `${s.color || color}-ink` : done ? (s.color || color) : 'line-strong', strokeWidth: on ? 2 : 1,
        label: s.label, labelColor: on ? '#ffffff' : 'ink', labelSize: 13, delay: on ? S * 0.5 : 0 });
      if (s.sub) kit.text(`${key}-sub${i}`, { x: x + w / 2, y: y + h / 2 + 14, text: s.sub, size: 11, color: 'muted', mono: true });
      if (i < n - 1) kit.sarrow(`${key}-a${i}`, { x1: x + w + 2, y1: y, x2: x + w + gap - 2, y2: y, color: i < active ? color : 'line-strong', width: 1.6 });
    });
    if (flow && n) {
      const ax = x0 + active * (w + gap) + w / 2;
      kit.circle(`${key}-flow`, { x: ax, y: y - h / 2 - 12, r: 6, fill: 'yellow', stroke: 'yellow-ink', strokeWidth: 1.5, ease: 'out' });
    }
    if (note) kit.text(`${key}-note`, { x: x0 + active * (w + gap) + w / 2, y: y + h / 2 + 34, text: note, size: 12.5, weight: 700, color: `${color}-ink`, mono: true, delay: S * 0.6 });
  };

  // Dated events on a line; past events solid, future muted, a "now" marker glides to the current one.
  // events: [{ when, title }]; now: index.
  kit.timeline = (key, { events = [], now = events.length - 1, y = 20, x0 = -300, x1 = 300, color = 'blue' } = {}) => {
    const n = events.length || 1, step = n > 1 ? (x1 - x0) / (n - 1) : 0;
    kit.line(`${key}-axis`, { x1: x0 - 10, y1: y, x2: x1 + 10, y2: y, color: 'line-strong', width: 2 });
    const px = i => (n > 1 ? x0 + i * step : 0);
    kit.line(`${key}-done`, { x1: x0 - 10, y1: y, x2: px(Math.max(0, now)), y2: y, color, width: 3 });

    person(p) { // generic pictogram figure (never a likeness of a real person)

      let s = `<circle cx="${fs1(x)}" cy="${fs1(y - 52 * k)}" r="${fs1(9 * k)}" fill="${col}"${fo}${st}/>`;
      s += `<path d="M${T(-11, -40)} Q${T(0, -44)} ${T(11, -40)} L${T(9, -16)} L${T(-9, -16)} Z" fill="${col}"${fo}${st}/>`;
      const leg = (a, b) => `<path d="M${T(a, -16)} L${T(b, 0)}" stroke="${col}" stroke-width="${fs1(6 * k)}" stroke-linecap="round" fill="none"/>`;

      if (pose === 'wave') s += arm(-10, -38, -16, -20) + arm(10, -38, 20, -58);
      else if (pose === 'point') s += arm(-10, -38, -16, -20) + arm(10, -38, 30, -40);
      else if (pose === 'think') s += arm(-10, -38, -16, -20) + `<path d="M${T(10, -38)} L${T(14, -30)} L${T(4, -48)}" stroke="${col}" stroke-width="${fs1(5 * k)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
      else if (pose === 'cheer') s += arm(-10, -38, -20, -58) + arm(10, -38, 20, -58);

      if (p.label) s += textSvg(x, y + 14, { text: p.label, size: p.labelSize || 12, weight: 600, color: p.labelColor || 'ink-2' });

    },
    icon(p) { // a Fluent icon from the vendored set, centred on (x, y)
      const d = ICONS[p.name] || ICONS['circle-hint'], sz = p.size || 32, k = sz / 20;
      let s = `<g transform="translate(${fs1((p.x || 0) - sz / 2)},${fs1((p.y || 0) - sz / 2)}) scale(${k.toFixed(3)})" fill="${kit.color(p.color || 'ink-2')}">${d.map(q => `<path d="${q}"/>`).join('')}</g>`;
      if (p.label) s += textSvg(p.x || 0, (p.y || 0) + sz / 2 + 12, { text: p.label, size: p.labelSize || 12, weight: 600, color: p.labelColor || 'ink-2' });

    },
  };
  const strokeMul = () => (style.stroke || 1);

  function interp(pts, at) {
    if (!pts.length) return 0;
    if (at <= pts[0][0]) return pts[0][1];

    return pts[pts.length - 1][1];
  }
  function scales(p) {
    const { x = -200, y = -120, w = 400, h = 240 } = p;
    const all = (p.series || []).flatMap(se => se.points || (se.values || []).map((v, i) => [p.xs ? p.xs[i] : i, v])).concat((p.points || []).map(q => [q.x, q.y]));
    const xMin = p.xMin ?? Math.min(0, ...all.map(q => q[0])), xMax = p.xMax ?? Math.max(1, ...all.map(q => q[0]));

    const fmt = v => (Math.abs(v) >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : String(+v.toFixed(2)));

        if (p.grid) s += `<line x1="${fs1(sc.x0)}" y1="${fs1(sc.y(v))}" x2="${fs1(sc.x0 + sc.w)}" y2="${fs1(sc.y(v))}" stroke="${kit.color('line')}" stroke-width="1"/>`;
      }
    }
    if (p.xLabel) s += `<text x="${fs1(sc.x0 + sc.w / 2)}" y="${fs1(sc.y0 + 32)}" text-anchor="middle" font-size="12" font-weight="600" fill="${kit.color('ink-2')}">${esc(p.xLabel)}</text>`;
    if (p.yLabel) s += `<text x="${fs1(sc.x0)}" y="${fs1(sc.yTop - 12)}" text-anchor="middle" font-size="12" font-weight="600" fill="${kit.color('ink-2')}">${esc(p.yLabel)}</text>`;

  }
  function textSvg(x, y, p) {
    let str = String(p.text ?? '');
    if (p.writeT != null && p.writeT < 1) str = str.slice(0, Math.round(str.length * Math.max(0, p.writeT)));
    const lines = str.split('\n');
    const fs = p.size || 13, lh = fs * 1.3;

  function arrowSvg(a, b, p) {

    let d;

      const len = Math.hypot(dx, dy) || 1, k = p.curve;
      d = `M${fs1(a[0])},${fs1(a[1])} Q${fs1(mx - (dy / len) * k)},${fs1(my + (dx / len) * k)} ${fs1(b[0])},${fs1(b[1])}`;
    } else d = `M${fs1(a[0])},${fs1(a[1])} L${fs1(b[0])},${fs1(b[1])}`;

  }

    if (!draw[type]) throw new Error(`unknown primitive ${type}`);

    const dur = instant ? 0 : kit.duration;
    const k = dur / MOTION.state;   // motion tokens scale with the kit's duration (0 when instant or reduced)

      let n = nodes.get(key);

      const d = props.motion && MOTION[props.motion] ? MOTION[props.motion] * k : dur;

    kit.mesh = mesh;

  kit.destroy = () => { cancelAnimationFrame(raf); kit.clear(); kit.mesh?.destroy(); svg.remove(); delete stage.dataset.style; };
  installTemplates(kit);
  return kit;
}
