:root {
  --bg: #FAFAF8; --surface: #FFFFFF; --surface-2: #F3F3F0; --ink: #1B1B1F; --ink-2: #3A3A40; --muted: #737373;
  --line: #E6E6E1; --line-strong: #D4D4CE; --dot: #D9D9D3;
  /* accents as fills */
  --red: #F25022; --green: #7FBA00; --blue: #00A4EF; --yellow: #FFB900;
  /* accents as text/lines (contrast-tuned per mode) */
  --red-ink: #C43E1C; --green-ink: #3F7D00; --blue-ink: #0067B8; --yellow-ink: #8A6100;
  --red-soft: #FDECE6; --green-soft: #EEF6E0; --blue-soft: #E3F4FC; --yellow-soft: #FFF5DB;
  --purple: #8661C5; --purple-ink: #6A44A8; --purple-soft: #F0EAF9;
  --shadow: 0 1px 2px rgba(20,20,30,.04), 0 4px 16px rgba(20,20,30,.05);
  --radius: 10px; --radius-sm: 6px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --tree-w: 248px; --narr-w: 380px; --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171A; --surface: #1F2024; --surface-2: #26272C; --ink: #EDEDED; --ink-2: #CFCFD2; --muted: #9A9A9A;
    --line: #2E2F35; --line-strong: #3B3C43; --dot: #34353C;
    --red: #F25022; --green: #7FBA00; --blue: #00A4EF; --yellow: #FFB900;
    --red-ink: #FF7A50; --green-ink: #9BD23C; --blue-ink: #4CC2FF; --yellow-ink: #FFC83D;
    --red-soft: #3A2019; --green-soft: #26321A; --blue-soft: #14303D; --yellow-soft: #3A3019;
    --purple-ink: #B79CF0; --purple-soft: #2A2238;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16171A; --surface: #1F2024; --surface-2: #26272C; --ink: #EDEDED; --ink-2: #CFCFD2; --muted: #9A9A9A;
  --line: #2E2F35; --line-strong: #3B3C43; --dot: #34353C;
  --red-ink: #FF7A50; --green-ink: #9BD23C; --blue-ink: #4CC2FF; --yellow-ink: #FFC83D;
  --red-soft: #3A2019; --green-soft: #26321A; --blue-soft: #14303D; --yellow-soft: #3A3019;
  --purple-ink: #B79CF0; --purple-soft: #2A2238;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--blue-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
code, kbd, pre, .mono { font-family: var(--mono); font-size: .9em; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { flex: none; vertical-align: -4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; height: var(--top-h); display: flex; align-items: center; gap: 16px;
  padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 18px; height: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; transform: rotate(45deg) scale(.82); }
.brand-mark i { display: block; border-radius: 1.5px; }
.brand-mark i:nth-child(1) { background: var(--red); } .brand-mark i:nth-child(2) { background: var(--green); }
.brand-mark i:nth-child(3) { background: var(--blue); } .brand-mark i:nth-child(4) { background: var(--yellow); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border: 0; background: none; border-radius: 8px;
  color: var(--muted); white-space: nowrap; font-size: 13.5px; font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.tab[aria-selected="true"] .ic { color: var(--blue-ink); }
.tab .num { font: 11px var(--mono); color: var(--muted); opacity: .7; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.menu-btn { display: none; }

/* search */
.search { position: relative; }
.search input { width: 200px; height: 34px; padding: 0 10px 0 32px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: 13.5px var(--font); }
.search input:focus { outline: none; border-color: var(--blue); }
.search .ic { position: absolute; left: 9px; top: 11px; color: var(--muted); }
.search-results { position: absolute; right: 0; top: 40px; width: 320px; max-height: 360px; overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: none; }
.search-results.open { display: block; }
.search-results a { display: flex; gap: 8px; align-items: baseline; padding: 7px 9px; border-radius: 6px; color: var(--ink); font-size: 13.5px; }
.search-results a:hover, .search-results a.active { background: var(--surface-2); text-decoration: none; }
.search-results small { color: var(--muted); margin-left: auto; white-space: nowrap; }
.search-results .empty { padding: 10px; color: var(--muted); font-size: 13px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--tree-w) minmax(0, 1fr) var(--narr-w); min-height: calc(100vh - var(--top-h)); }
.shell.wide { grid-template-columns: var(--tree-w) minmax(0, 1fr); }
.pane-tree { border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow: auto; }
.center { padding: 22px 26px 28px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.pane-narr { border-left: 1px solid var(--line); padding: 22px 22px 28px; background: var(--surface); position: sticky; top: var(--top-h);
  height: calc(100vh - var(--top-h)); overflow: auto; display: flex; flex-direction: column; gap: 16px; }

/* tree */
.tree-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 8px 10px; font-weight: 600; }
.tree-domain { margin: 14px 8px 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.tree-domain .sw { width: 8px; height: 8px; border-radius: 2px; }
.tree ul { list-style: none; margin: 0; padding: 0 0 0 12px; }
.tree > ul { padding-left: 0; }
.tree li a, .tree li span.ghost { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px; font-size: 13.5px; color: var(--ink-2); }
.tree li a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.tree li a.current { background: var(--blue-soft); color: var(--ink); font-weight: 600; }
.tree li span.ghost { color: var(--muted); cursor: help; }
.tree .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tree .ghost .dot { background: transparent !important; border: 1.2px dashed var(--muted); }
.tree-foot { margin: 18px 8px 0; font-size: 12px; color: var(--muted); }

/* lesson head */
.lesson-head h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.02em; font-weight: 650; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.chip b { font-family: var(--mono); font-weight: 700; color: var(--ink); }
.chip.level { border-color: transparent; background: var(--blue-soft); color: var(--blue-ink); font-weight: 600; }

/* stage */
.stage-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 420px; }
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 50px; }
.metrics { display: flex; gap: 6px; flex-wrap: wrap; }
.metric { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 10px; border-radius: 7px; background: var(--surface-2); font-size: 12.5px; color: var(--muted); }
.metric b { font: 700 13px var(--mono); color: var(--ink); transition: color .3s; }
.metric.changed b { color: var(--blue-ink); }
.ctrls { display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.btn:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--blue-ink); border-color: var(--blue-ink); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0b1a22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b1a22; } }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
.stage { position: relative; flex: 1; min-height: 340px; overflow: hidden;
  /* isometric (staggered) dot lattice */
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px), radial-gradient(circle, var(--dot) 1px, transparent 1.4px);
  background-size: 28px 16.2px; background-position: 0 0, 14px 8.1px; }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage > canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; cursor: grab; }
.stage > canvas:active { cursor: grabbing; }
.stage-badge { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; pointer-events: none; }
.stage-error { position: absolute; inset: 0; display: grid; place-items: center; color: var(--red-ink); font-size: 14px; padding: 20px; text-align: center; }

/* stage styles (lesson.style / tab.style): the kit re-skins shapes, these set paper, fonts and tokens */
.stage[data-style="line"] { --grid: color-mix(in srgb, var(--blue) 13%, transparent);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-position: center; }
.stage[data-style="sketch"] { background: #FCFBF6; background-image: radial-gradient(circle at 30% 20%, rgba(0,0,0,.025), transparent 60%); }
.stage[data-style="sketch"] text, .stage[data-style="chalk"] text { font-family: "Patrick Hand", var(--font); letter-spacing: .01em; }
.stage[data-style="sketch"] text.mono, .stage[data-style="chalk"] text.mono { font-family: "Patrick Hand", var(--mono); }
.stage[data-style="chalk"] { background: radial-gradient(ellipse at 50% 40%, #2C3D35, #1E2924 75%);
  --ink: #F2F0E6; --ink-2: #DAD8CC; --muted: #A3AA9C; --surface: #2A3A33; --surface-2: #31433B; --line: #42574D; --line-strong: #74887D; --bg: #1E2924;
  --blue: #8FD3FF; --blue-ink: #C2E8FF; --blue-soft: #2C4A56; --green: #B5E48C; --green-ink: #D6F5BC; --green-soft: #34503A;
  --red: #FF9E8A; --red-ink: #FFC6B9; --red-soft: #5A3A33; --yellow: #FFE38A; --yellow-ink: #FFF1BD; --yellow-soft: #57502F;
  --purple: #CDB6FF; --purple-ink: #E2D5FF; --purple-soft: #3D3552; }
.stage[data-style="pictogram"] { background-image: none; background: var(--surface-2); }
.stage[data-style="3d"] > canvas { pointer-events: none; cursor: default; }
/* Above phone width the stage takes the scene's own 8:5 shape, so the drawing fills it instead of floating in a tall box. */
@media (min-width: 561px) {
  .stage-card { flex: none; min-height: 0; }
  .stage { flex: none; aspect-ratio: 8 / 5; min-height: 300px; max-height: calc(100vh - 250px); }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage[data-style="sketch"] { background: #1C1D1A; } }
:root[data-theme="dark"] .stage[data-style="sketch"] { background: #1C1D1A; }
.style-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.style-seg button { border: 0; background: var(--surface); padding: 5px 9px; font-size: 12.5px; color: var(--muted); }
.style-seg button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-ink); font-weight: 600; }

/* svg scene text */
.stage text { font-family: var(--font); }
.stage text.mono { font-family: var(--mono); }

/* rail */
.rail { display: flex; align-items: center; gap: 0; padding: 14px 18px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.rail-step { position: relative; display: flex; align-items: center; flex: 1; min-width: 38px; }
.rail-step:last-child { flex: 0; }
.rail-step::after { content: ""; flex: 1; height: 2px; background: var(--line); margin: 0 4px; border-radius: 2px; transition: background .3s; }
.rail-step:last-child::after { display: none; }
.rail-step.done::after { background: var(--blue); }
.rail-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); display: grid; place-items: center;
  font: 600 12px var(--mono); color: var(--muted); flex: none; transition: all .25s var(--ease); padding: 0; }
.rail-dot:hover { border-color: var(--blue); color: var(--ink); }
.rail-step.done .rail-dot { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-ink); }
.rail-step.active .rail-dot { background: var(--blue-ink); border-color: var(--blue-ink); color: var(--surface); transform: scale(1.12); box-shadow: 0 0 0 4px var(--blue-soft); }

/* narration pane */
.step-count { font: 600 11.5px var(--mono); letter-spacing: .08em; color: var(--blue-ink); text-transform: uppercase; }
.step-title { font-size: 20px; line-height: 1.25; margin: 4px 0 0; letter-spacing: -.01em; font-weight: 650; }
.narration { font-size: 15px; color: var(--ink-2); }
.narration p { margin: 0 0 10px; }
.narration strong { color: var(--ink); }
.narration code, .card code, .doc code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
a.cite { font: 600 10.5px var(--mono); vertical-align: super; padding: 0 3px; border-radius: 4px; background: var(--blue-soft); color: var(--blue-ink); margin-left: 1px; }
a.cite:hover { text-decoration: none; filter: brightness(.95); }
.callout { border-radius: 8px; padding: 10px 12px 10px 12px; font-size: 13.5px; display: flex; gap: 9px; border: 1px solid transparent; }
.callout .ic { margin-top: 2px; }
.callout b { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.callout.good-to-know { background: var(--yellow-soft); border-color: color-mix(in srgb, var(--yellow) 40%, transparent); }
.callout.good-to-know .ic, .callout.good-to-know b { color: var(--yellow-ink); }
.callout.warning { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.callout.warning .ic, .callout.warning b { color: var(--red-ink); }
.callout.insight { background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 35%, transparent); }
.callout.insight .ic, .callout.insight b { color: var(--blue-ink); }
.section-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.changed-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.changed-list li { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
.changed-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; transform: translateY(-1px); }
.changed-list li.rm::before { background: var(--red); }
.changed-list li.hl::before { background: var(--yellow); }
.nav-btns { display: flex; justify-content: space-between; gap: 8px; }
.nav-btns .btn { flex: 1; justify-content: center; padding: 9px; }
.kbd-hint { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: -8px; }
kbd { border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 10.5px; }

/* code panel */
.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.6 var(--mono); overflow: auto; padding: 8px 0; }
.code .ln { display: block; padding: 0 12px 0 0; white-space: pre; transition: background .3s; border-left: 3px solid transparent; }
.code .ln::before { content: attr(data-n); display: inline-block; width: 30px; text-align: right; padding-right: 12px; color: var(--muted); opacity: .6; }
.code .ln.hl { background: var(--yellow-soft); border-left-color: var(--yellow); }
.tok-k { color: var(--blue-ink); font-weight: 700; } .tok-s { color: var(--green-ink); } .tok-c { color: var(--muted); font-style: italic; } .tok-n { color: var(--red-ink); }
.formula { font: 15px var(--mono); padding: 12px; text-align: center; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--line); }

/* objectives */
.objectives { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.objectives li label { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; align-items: flex-start; }
.objectives input { accent-color: var(--green); margin-top: 3px; }

/* ---------- doc views (quiz, related, cheatsheet, story, trade-offs) ---------- */
.doc { max-width: 920px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.doc h2 { font-size: 19px; margin: 8px 0 0; letter-spacing: -.01em; }
.doc .lede { color: var(--muted); margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.cards.quad { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.card p { margin: 0; font-size: 14px; color: var(--ink-2); }
.card ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.card li { margin: 3px 0; }
.card.ghost { border-style: dashed; box-shadow: none; background: transparent; }
.card .cmd { margin-top: 8px; display: flex; gap: 6px; align-items: center; font: 12.5px var(--mono); background: var(--surface-2); padding: 5px 8px; border-radius: 6px; }
.card .cmd button { margin-left: auto; border: 0; background: none; color: var(--blue-ink); font-size: 12px; }
.tag { display: inline-block; white-space: nowrap; flex: none; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.built { background: var(--green-soft); color: var(--green-ink); }
.tag.ghost { background: transparent; border: 1px dashed var(--line-strong); }
.sources { counter-reset: s; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.sources li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
.sources li:target { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.sources .sid { font: 700 12px var(--mono); color: var(--blue-ink); padding-top: 2px; }
.sources small { display: block; color: var(--muted); font-size: 12.5px; }

/* quiz */
.quiz-q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.quiz-q h3 { margin: 0 0 4px; font-size: 15.5px; line-height: 1.4; }
.quiz-q .qmeta { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 8px; }
.opts { display: grid; gap: 7px; }
.opt { text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt .k { font: 600 12px var(--mono); color: var(--muted); }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt:disabled { cursor: default; }
.why { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); padding: 9px 12px; border-radius: 8px; background: var(--surface-2); }
.score { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.score .big { font: 700 28px var(--mono); }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.ring::after { content: ""; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); }

/* story timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -29px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--blue); }
.timeline .when { font: 700 12.5px var(--mono); color: var(--blue-ink); }
.timeline h3 { margin: 2px 0 2px; font-size: 15px; }
.timeline p { margin: 0; font-size: 14px; color: var(--ink-2); }
.myth { display: grid; gap: 8px; }
.myth .row { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.myth .row b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; min-width: 62px; padding-top: 2px; }
.myth .m b { color: var(--red-ink); } .myth .w b { color: var(--yellow-ink); } .myth .t b { color: var(--green-ink); }

/* cheatsheet */
.glossary { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.glossary dt { font-weight: 600; } .glossary dd { margin: 0; color: var(--ink-2); }

/* playground */
.controls { display: flex; flex-direction: column; gap: 14px; }
.control label { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }
.control label output { font: 700 13px var(--mono); color: var(--blue-ink); }
.control input[type=range] { width: 100%; accent-color: var(--blue); }
.control .seg { display: flex; gap: 4px; flex-wrap: wrap; }
.control .seg button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 13px; }
.control .seg button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-ink); font-weight: 600; }

/* sub-lesson switcher (deep dive) */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs a { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); background: var(--surface); }
.subtabs a.on { border-color: var(--blue); color: var(--blue-ink); background: var(--blue-soft); font-weight: 600; }
.subtabs a:hover { text-decoration: none; border-color: var(--line-strong); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; transition: all .25s var(--ease); pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.fatal { max-width: 560px; margin: 80px auto; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

/* ---------- responsive ---------- */
@media (max-width: 1560px) { .tabs.many .tab:not([aria-selected="true"]) .label { display: none; } .tabs.many .tab { padding: 7px 9px; } }
@media (max-width: 1180px) { :root { --narr-w: 330px; --tree-w: 210px; } }
@media (max-width: 960px) {
  .shell, .shell.wide { grid-template-columns: 1fr; }
  .pane-tree { position: fixed; z-index: 30; left: 0; top: var(--top-h); width: 280px; background: var(--surface); transform: translateX(-100%);
    transition: transform .25s var(--ease); box-shadow: var(--shadow); }
  body.tree-open .pane-tree { transform: none; }
  .pane-narr { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
  .menu-btn { display: inline-grid; }
  .center { padding: 16px; }
  .search input { width: 140px; }
  .stage { min-height: 300px; }
  .topbar { gap: 10px; padding: 0 12px; }
  .brand span { display: none; }
}
@media (max-width: 560px) {
  .search { display: none; }
  .lesson-head h1 { font-size: 21px; }
  .stage-card { min-height: 360px; }
  .stage { min-height: 280px; }
  .glossary { grid-template-columns: 1fr; }
  .tab .label { display: none; }
  .tab[aria-selected="true"] .label { display: inline; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- print (Cheatsheet) ---------- */
@media print {
  .topbar, .pane-tree, .pane-narr, .stage-card, .ctrls, .no-print { display: none !important; }
  .shell, .shell.wide { display: block; }
  body { background: #fff; color: #000; font-size: 12px; }
  .card, .quiz-q, .sources li { box-shadow: none; break-inside: avoid; }
  .doc { max-width: none; }
}

/* Topic library page (topics/index.html). Loaded after theme.css. */
body.library { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.library .lib-title { color: var(--muted); font-size: 14px; padding-left: 14px; border-left: 1px solid var(--line); }
.library .top-actions { margin-left: auto; }
.lib-shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
.lib-stage { position: relative; min-width: 0; overflow: hidden;
  background: radial-gradient(circle, var(--dot) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--bg); }
.lib-graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
.lib-graph.panning { cursor: grabbing; }
.viewport { transform-origin: 0 0; }

/* edges */
.edge { fill: none; stroke-linecap: round; transition: opacity .2s, stroke .2s; }
.edge.contains { stroke: var(--line-strong); stroke-width: 2.5; }
.edge.prereq, .edge.next { stroke: var(--blue-ink); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .55; }
.edge.to-sugg { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; opacity: .5; }
.edge.hl { opacity: 1; stroke-width: 2.4; }
.edge.contains.hl { stroke: var(--ink-2); }
.edge.dim { opacity: .12; }
.arrow { fill: var(--blue-ink); opacity: .7; }
.arrow.hl { opacity: 1; }

/* nodes */
.node { cursor: pointer; transition: opacity .2s; outline: none; }
.node .halo { fill: none; stroke: transparent; stroke-width: 3; transition: stroke .2s; }
.node .dot { stroke-width: 2; transition: r .2s; }
.node.built .dot { fill: var(--blue); stroke: var(--surface); }
.node.draft .dot { fill: var(--yellow-soft); stroke: var(--yellow); stroke-width: 2.5; }
.node.suggested .dot { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 3 2.5; stroke-width: 1.4; }
.node .count { fill: #fff; font: 700 11px var(--mono); text-anchor: middle; pointer-events: none; }
.node .label { fill: var(--ink); font-size: 12.5px; font-weight: 600; text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node.suggested .label { fill: var(--muted); font-weight: 400; font-size: 11.5px; }
.node:hover .halo, .node:focus-visible .halo { stroke: var(--blue-soft); }
.node.sel .halo { stroke: var(--blue); }
.node.hit .label { fill: var(--blue-ink); }
.node.dim { opacity: .18; }

/* overlays on the stage */
.lib-tools { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
.lib-tools > * { pointer-events: auto; }
.lib-toggle { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; font-size: 13px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); cursor: pointer; }
.lib-legend { position: absolute; left: 12px; bottom: 34px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted);
  background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.lib-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-node { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.lg-node.built { background: var(--blue); }
.lg-node.draft { background: var(--yellow-soft); border: 2px solid var(--yellow); }
.lg-node.suggested { border: 1.4px dashed var(--muted); }
.lg-edge { width: 20px; height: 0; display: inline-block; }
.lg-edge.contains { border-top: 2.5px solid var(--line-strong); }
.lg-edge.related { border-top: 1.5px dashed var(--blue-ink); }
.lib-hint { position: absolute; left: 12px; bottom: 6px; margin: 0; font-size: 11.5px; color: var(--muted); }
.lib-empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; color: var(--muted); }
.lib-empty h2 { color: var(--ink); margin: 10px 0 4px; }
.lib-empty p { max-width: 380px; }

/* side panel */
.lib-panel { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 18px 20px 28px; font-size: 14px; }
.lib-panel h2 { font-size: 20px; letter-spacing: -.01em; margin: 4px 0 8px; }
.lib-panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 6px; }
.lib-panel p { margin: 8px 0; }
.lib-panel .small { font-size: 13px; }
.lib-panel .muted, .lib-tools .muted { color: var(--muted); }
.lib-panel .stats { color: var(--ink-2); }
.lib-panel .foot { margin-top: 22px; }
.lib-panel .kicker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.lib-panel .crumbs { font-size: 13px; }
.lib-panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.lib-panel .chip.draft { background: var(--yellow-soft); color: var(--yellow-ink); border-color: transparent; }
.lib-panel .open { margin: 8px 0 4px; padding: 8px 14px; }
.lib-panel .back { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.lib-panel .back:hover { color: var(--ink); }
.lib-panel ul { list-style: none; margin: 0; padding: 0; }
.lib-panel .outline ul { padding-left: 16px; border-left: 1px solid var(--line); margin-left: 6px; }
.lib-panel .outline li, .lib-panel .refs li { padding: 3px 0; }
.lib-panel .lib-why { color: var(--muted); font-size: 12.5px; }
.lnk { border: 0; background: none; padding: 0; font: inherit; color: var(--blue-ink); text-align: left; }
.lnk:hover { text-decoration: underline; }
.lnk.suggested { color: var(--ink-2); }
.lnk.draft { color: var(--yellow-ink); }
.lib-panel .cmd { display: flex; align-items: center; gap: 8px; }
.lib-panel .cmd code { flex: 1; padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }

@media (max-width: 860px) {
  body.library { height: auto; overflow: auto; }
  .lib-shell { display: block; }
  .lib-stage { height: 64vh; border-bottom: 1px solid var(--line); }
  .lib-panel { border-left: 0; padding: 16px; }
  .library .lib-title { display: none; }
  .library .search input { width: 140px; }
  .lib-legend { bottom: 8px; right: 12px; }
  .lib-hint { display: none; }
}
</style>
